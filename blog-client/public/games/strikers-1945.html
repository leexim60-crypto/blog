};
THEMES.base.land = '#332b48';
const SKY_TOP = { space: '#04060f', moon: '#0a0a12', base: '#0b0816' };

function makeBackground(theme){
  const T = THEMES[theme] || THEMES.city;
  const b = {
    theme: theme, T: T, y: 0, speed: 1.35,
    feats: [], stars: [], dust: [], cloudA: 0.10
  };
  if (theme === 'space' || theme === 'moon' || theme === 'base'){
    for (let i = 0; i < 110; i++) b.stars.push({ x: rand(0, W), y: rand(0, H), r: rand(0.4, 1.5), s: rand(0.6, 3.4), a: rand(0.25, 1) });
    for (let i = 0; i < 20; i++) b.dust.push({ x: rand(0, W), y: rand(0, H), r: rand(0.6, 2), s: rand(2, 6), a: rand(0.12, 0.4) });
    b.cloudA = 0;
  }
  let y = -H * 0.7;
  while (y < H * 2.6){ b.feats.push(makeFeature(theme, y)); y += rand(145, 245); }
  return b;
}
function makeFeature(theme, y){
  const f = { y: y, kind: 'island', pts: [], extras: [], fields: [], y2: 0 };
  switch (theme){
    case 'sea': {
      f.kind = 'island';
      const n = irand(8, 13), rx = rand(34, 74), ry = rand(26, 54);
      const cx = rand(rx * 0.4, W - rx * 0.4);
      for (let i = 0; i < n; i++){
        const a = i / n * TAU;
        const w = 1 + Math.sin(a * 3 + y) * 0.22;
        f.pts.push({ x: cx + Math.cos(a) * rx * rand(0.62, 1.18) * w, y: y + Math.sin(a) * ry * rand(0.62, 1.18) * w });
      }
      for (let i = 0; i < irand(2, 5); i++) f.extras.push({ t: 'tree', x: cx + rand(-rx * 0.5, rx * 0.5), y: y + rand(-ry * 0.5, ry * 0.5), r: rand(2, 4) });
      break;
    }
    case 'city': {
      f.kind = 'city';
      const w = rand(90, 190), h = rand(80, 170), x = rand(-30, W - w + 30);
      f.rect = { x: x, y: y, w: w, h: h };
      // 建筑网格
      const cols = irand(4, 7), rows = irand(3, 6);
      for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++){
        if (Math.random() < 0.22) continue;
        f.extras.push({
          x: x + 6 + i * ((w - 12) / cols) + rand(0, 3),
          y: y + 6 + j * ((h - 12) / rows) + rand(0, 3),
          w: (w - 12) / cols * rand(0.5, 0.82),
          h: (h - 12) / rows * rand(0.5, 0.82)
        });
      }
      f.fields.push({ x: x + w * 0.6, y: y + h * 0.7, w: w * 0.34, h: h * 0.24, a: rand(0, 6.28) });
      break;
    }
    case 'snow': {
      f.kind = 'snowfield';
      const w = rand(110, 230), h = rand(90, 180), x = rand(-30, W - w + 30);
      f.rect = { x: x, y: y, w: w, h: h };
      for (let i = 0; i < irand(4, 8); i++){
        f.extras.push({ x: x + rand(8, w - 34), y: y + rand(10, h - 30), w: rand(14, 26), h: rand(11, 22) });
      }
      // 林线
      for (let i = 0; i < irand(10, 20); i++) f.extras.push({ t: 'tree', x: x + rand(4, w - 4), y: y + rand(4, h - 4), r: rand(1.6, 3.4) });
      break;
    }
    case 'desert': {
      f.kind = 'desert';
      const w = rand(120, 250), h = rand(100, 190), x = rand(-30, W - w + 30);
      f.rect = { x: x, y: y, w: w, h: h };
      for (let i = 0; i < irand(3, 7); i++) f.extras.push({ x: x + rand(8, w - 40), y: y + rand(10, h - 30), w: rand(18, 34), h: rand(12, 22) });
      f.fields.push({ x: x + rand(10, w - 50), y: y + rand(10, h - 40), w: rand(30, 52), h: rand(22, 36), a: rand(0, 6.28) });
      break;
    }
    case 'moon': {
      f.kind = 'moonsea';
      const n = irand(9, 15), rx = rand(80, 165), ry = rand(65, 135);
      const cx = rand(rx * 0.5, W - rx * 0.5);
      for (let i = 0; i < n; i++){
        const a = i / n * TAU;
        const w = 1 + Math.sin(a * 3 + y * 0.01) * 0.2;
        f.pts.push({ x: cx + Math.cos(a) * rx * rand(0.68, 1.1) * w, y: y + Math.sin(a) * ry * rand(0.68, 1.1) * w });
      }
      f.cx = cx; f.cy = y;
      for (let i = 0; i < irand(5, 10); i++){
        const a = rand(0, TAU), rr = rand(0, 0.62);
        f.extras.push({ t: 'crater', x: cx + Math.cos(a) * rx * rr, y: y + Math.sin(a) * ry * rr, r: rand(6, 24) });
      }
      break;
    }
    case 'base': {
      f.kind = 'base';
      const w = rand(130, 260), h = rand(100, 200), x = rand(-30, W - w + 30);
      f.rect = { x: x, y: y, w: w, h: h };
      for (let i = 0; i < irand(6, 12); i++) f.extras.push({ x: x + rand(6, w - 30), y: y + rand(8, h - 26), w: rand(14, 30), h: rand(10, 22) });
      break;
    }
    default: {
      f.kind = 'nebula';
      f.neb = { x: rand(0, W), y: y, r: rand(70, 170), a: rand(0.05, 0.14) };
      for (let i = 0; i < irand(3, 7); i++) f.extras.push({ x: rand(10, W - 10), y: y + rand(-60, 60), r: rand(3, 9) });
      break;
    }
  }
  return f;
}
function updateBackground(){
  if (!bg) return;
  bg.y += bg.speed;
  const off = bg.y;
  // 地形从下方补充: 移出屏幕顶部的区块重生到最下方
  let maxY = -1e9;
  for (const f of bg.feats) if (f.y > maxY) maxY = f.y;
  for (let i = 0; i < bg.feats.length; i++){
    const f = bg.feats[i];
    if (f.y - off < -470){
      const nf = makeFeature(bg.theme, maxY + rand(145, 245));
      maxY = nf.y;
      bg.feats[i] = nf;
    }
  }
  for (const s of bg.stars){ s.y += s.s * 0.45; if (s.y > H){ s.y -= H; s.x = rand(0, W); } }
  for (const d of bg.dust){ d.y += d.s; if (d.y > H){ d.y = -6; d.x = rand(0, W); } }
}
function drawBackground(){
  const T = bg.T;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, T.sea2); g.addColorStop(1, T.sea);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // 海面波纹
  if (bg.theme === 'sea' || bg.theme === 'city'){
    ctx.strokeStyle = 'rgba(255,255,255,0.045)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 16; i++){
      const yy = ((i * 46 + bg.y * 0.6) % (H + 60)) - 30;
      ctx.beginPath();
      ctx.moveTo(0, yy);
      for (let x = 0; x <= W; x += 30) ctx.lineTo(x, yy + Math.sin((x + i * 40 + GS.frame * 0.6) * 0.03) * 2.2);
      ctx.stroke();
    }
  }
  // 星空
  if (bg.stars.length){
    for (const s of bg.stars){
      ctx.globalAlpha = s.a;
      ctx.fillStyle = '#fff';
      ctx.fillRect(s.x, s.y, s.r, s.r * 3);
    }
    ctx.globalAlpha = 1;
    for (const d of bg.dust){
      ctx.globalAlpha = d.a;
      ctx.fillStyle = T.accent;
      ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  for (const f of bg.feats){
    const y = f.y - bg.y;
    if (y < -480 || y > H + 480) continue;
    ctx.save();
    ctx.translate(0, y - f.y);
    drawFeature(f, T);
    ctx.restore();
  }
  // 云
  if (bg.cloudA > 0){
    ctx.globalAlpha = bg.cloudA;
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 6; i++){
      const cy = ((i * 143 + GS.frame * 0.85) % (H + 220)) - 110;
      const cx = ((i * 197 + 60) % (W + 160)) - 80;
      ctx.beginPath();
      ctx.ellipse(cx, cy, 62, 17, 0, 0, TAU);
      ctx.ellipse(cx + 38, cy + 6, 40, 12, 0, 0, TAU);
      ctx.ellipse(cx - 34, cy + 5, 32, 10, 0, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}
function drawFeature(f, T){
  switch (f.kind){
    case 'island': {
      // 浅滩
      ctx.fillStyle = 'rgba(150,210,225,0.16)';
      ctx.beginPath(); ctx.moveTo(f.pts[0].x + 10, f.pts[0].y + 13);
      for (let j = 1; j < f.pts.length; j++) ctx.lineTo(f.pts[j].x + 10, f.pts[j].y + 13);
      ctx.closePath(); ctx.fill();
      // 沙岸
      ctx.fillStyle = T.sand;
      ctx.beginPath(); ctx.moveTo(f.pts[0].x, f.pts[0].y);
      for (let j = 1; j < f.pts.length; j++) ctx.lineTo(f.pts[j].x, f.pts[j].y);
      ctx.closePath(); ctx.fill();
      // 内陆
      let cx = 0, cy = 0;
      for (const p of f.pts){ cx += p.x; cy += p.y; }
      cx /= f.pts.length; cy /= f.pts.length;
      ctx.fillStyle = T.land;
      ctx.beginPath(); ctx.moveTo(lerp(f.pts[0].x, cx, 0.2), lerp(f.pts[0].y, cy, 0.2));
      for (let j = 1; j < f.pts.length; j++) ctx.lineTo(lerp(f.pts[j].x, cx, 0.2), lerp(f.pts[j].y, cy, 0.2));
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = T.land2;
      ctx.beginPath(); ctx.moveTo(lerp(f.pts[0].x, cx, 0.45), lerp(f.pts[0].y, cy, 0.45));
      for (let j = 1; j < f.pts.length; j++) ctx.lineTo(lerp(f.pts[j].x, cx, 0.45), lerp(f.pts[j].y, cy, 0.45));
      ctx.closePath(); ctx.fill();
      for (const e of f.extras){
        if (e.t === 'tree'){
          ctx.fillStyle = '#2f5a2c';
          ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, TAU); ctx.fill();
        }
      }
      break;
    }
    case 'city': {
      const r = f.rect;
      ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(r.x + 5, r.y + 6, r.w, r.h);
      ctx.fillStyle = T.land2; ctx.fillRect(r.x, r.y, r.w, r.h);
      ctx.fillStyle = T.land; ctx.fillRect(r.x + 2, r.y + 2, r.w - 4, r.h - 4);
      // 道路
      ctx.strokeStyle = T.road; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(r.x + r.w * 0.42, r.y + 2); ctx.lineTo(r.x + r.w * 0.42, r.y + r.h - 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(r.x + 2, r.y + r.h * 0.55); ctx.lineTo(r.x + r.w - 2, r.y + r.h * 0.55); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(r.x + r.w * 0.42, r.y + 2); ctx.lineTo(r.x + r.w * 0.42, r.y + r.h - 2); ctx.stroke();
      // 建筑
      for (let i = 0; i < f.extras.length; i++){
        const e = f.extras[i];
        ctx.fillStyle = (i % 3 === 0) ? T.bld3 : ((i % 3 === 1) ? T.bld : T.bld2);
        ctx.fillRect(e.x, e.y, e.w, e.h);
        ctx.fillStyle = 'rgba(255,255,255,0.16)';
        ctx.fillRect(e.x, e.y, e.w, 2);
        ctx.fillStyle = 'rgba(0,0,0,0.22)';
        ctx.fillRect(e.x, e.y + e.h - 2, e.w, 2);
      }
      for (const fd of f.fields){
        ctx.save(); ctx.translate(fd.x, fd.y); ctx.rotate(fd.a);
        ctx.fillStyle = 'rgba(120,150,80,0.5)'; ctx.fillRect(-fd.w / 2, -fd.h / 2, fd.w, fd.h);
        ctx.strokeStyle = 'rgba(255,255,255,0.14)'; ctx.lineWidth = 1;
        for (let i = 1; i < 5; i++){
          ctx.beginPath(); ctx.moveTo(-fd.w / 2, -fd.h / 2 + i * fd.h / 5); ctx.lineTo(fd.w / 2, -fd.h / 2 + i * fd.h / 5); ctx.stroke();
        }
        ctx.restore();
      }
      break;
    }
    case 'snowfield': {
      const r = f.rect;
      ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fillRect(r.x + 4, r.y + 5, r.w, r.h);
      ctx.fillStyle = T.land2; ctx.fillRect(r.x, r.y, r.w, r.h);
      ctx.fillStyle = T.land; ctx.fillRect(r.x + 3, r.y + 3, r.w - 6, r.h - 6);
      ctx.strokeStyle = 'rgba(120,150,180,0.45)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(r.x, r.y + r.h * 0.46); ctx.lineTo(r.x + r.w, r.y + r.h * 0.46); ctx.stroke();
      for (const e of f.extras){
        if (e.t === 'tree'){
          ctx.fillStyle = '#2e4a3a';
          ctx.beginPath(); ctx.moveTo(e.x, e.y - e.r); ctx.lineTo(e.x + e.r, e.y + e.r); ctx.lineTo(e.x - e.r, e.y + e.r); ctx.closePath(); ctx.fill();
        } else {
          ctx.fillStyle = T.bld2; ctx.fillRect(e.x, e.y, e.w, e.h);
          ctx.fillStyle = T.bld3; ctx.fillRect(e.x, e.y, e.w, e.h * 0.5);
        }
      }
      break;
    }
    case 'desert': {
      const r = f.rect;
      ctx.fillStyle = 'rgba(0,0,0,0.16)'; ctx.fillRect(r.x + 4, r.y + 5, r.w, r.h);
      ctx.fillStyle = T.land2; ctx.fillRect(r.x, r.y, r.w, r.h);
      ctx.fillStyle = T.land; ctx.fillRect(r.x + 3, r.y + 3, r.w - 6, r.h - 6);
      // 沙丘
      ctx.strokeStyle = 'rgba(255,245,215,0.4)'; ctx.lineWidth = 2;
      for (let i = 0; i < 5; i++){
        ctx.beginPath();
        const yy = r.y + r.h * (0.12 + i * 0.19);
        ctx.moveTo(r.x + 3, yy);
        for (let x = 0; x <= r.w - 6; x += 16) ctx.lineTo(r.x + 3 + x, yy + Math.sin(x * 0.055 + i * 1.7) * 5);
        ctx.stroke();
      }
      for (const e of f.extras){
        ctx.fillStyle = T.bld2; ctx.fillRect(e.x, e.y, e.w, e.h);
        ctx.fillStyle = T.bld3; ctx.fillRect(e.x, e.y, e.w, e.h * 0.4);
      }
      for (const fd of f.fields){
        ctx.save(); ctx.translate(fd.x, fd.y); ctx.rotate(fd.a);
        ctx.fillStyle = 'rgba(70,130,70,0.55)'; ctx.fillRect(-fd.w / 2, -fd.h / 2, fd.w, fd.h);
        ctx.fillStyle = 'rgba(30,80,120,0.5)';
        ctx.beginPath(); ctx.ellipse(0, 0, fd.w * 0.3, fd.h * 0.3, 0, 0, TAU); ctx.fill();
        ctx.restore();
      }
      break;
    }
    case 'moonsea': {
      const cx = f.cx, cy = f.cy;
      // 边缘辉光
      ctx.fillStyle = 'rgba(180,180,200,0.10)';
      ctx.beginPath(); ctx.moveTo(f.pts[0].x * 1.0, lerp(f.pts[0].y, cy, -0.06));
      for (let j = 1; j < f.pts.length; j++){
        ctx.lineTo(lerp(f.pts[j].x, cx, -0.05), lerp(f.pts[j].y, cy, -0.05));
      }
      ctx.closePath(); ctx.fill();
      // 月面
      ctx.fillStyle = T.land2;
      ctx.beginPath(); ctx.moveTo(f.pts[0].x, f.pts[0].y);
      for (let j = 1; j < f.pts.length; j++) ctx.lineTo(f.pts[j].x, f.pts[j].y);
      ctx.closePath(); ctx.fill();
      // 内部亮面
      ctx.fillStyle = T.land;
      ctx.beginPath(); ctx.moveTo(lerp(f.pts[0].x, cx, 0.14), lerp(f.pts[0].y, cy, 0.14));
      for (let j = 1; j < f.pts.length; j++) ctx.lineTo(lerp(f.pts[j].x, cx, 0.14), lerp(f.pts[j].y, cy, 0.14));
      ctx.closePath(); ctx.fill();
      // 月尘
      ctx.fillStyle = 'rgba(255,255,255,0.10)';
      for (let i = 0; i < 20; i++){
        const a = (i * 2.4), rr = ((i * 37) % 100) / 100 * 0.55;
        ctx.fillRect(cx + Math.cos(a) * 120 * rr, cy + Math.sin(a) * 95 * rr, 3, 2);
      }
      for (const e of f.extras){
        if (e.t !== 'crater') continue;
        // 坑外隆起的亮边(光来自左上)
        ctx.strokeStyle = 'rgba(255,255,255,0.34)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.ellipse(e.x, e.y, e.r * 1.02, e.r * 0.8, 0, PI * 0.75, PI * 1.85); ctx.stroke();
        // 坑内阴影
        ctx.fillStyle = 'rgba(0,0,0,0.30)';
        ctx.beginPath(); ctx.ellipse(e.x, e.y, e.r, e.r * 0.78, 0, 0, TAU); ctx.fill();
        // 坑底
        ctx.fillStyle = 'rgba(60,60,70,0.55)';
        ctx.beginPath(); ctx.ellipse(e.x + e.r * 0.08, e.y + e.r * 0.1, e.r * 0.72, e.r * 0.54, 0, 0, TAU); ctx.fill();
        // 坑内受光侧
        ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.ellipse(e.x + e.r * 0.08, e.y + e.r * 0.1, e.r * 0.72, e.r * 0.54, 0, PI * 0.8, PI * 1.8); ctx.stroke();
      }
      break;
    }
    case 'base': {
      const r = f.rect;
      ctx.fillStyle = 'rgba(0,0,0,0.32)'; ctx.fillRect(r.x + 5, r.y + 6, r.w, r.h);
      ctx.fillStyle = T.land2; ctx.fillRect(r.x, r.y, r.w, r.h);
      ctx.fillStyle = T.land; ctx.fillRect(r.x + 3, r.y + 3, r.w - 6, r.h - 6);
      for (let i = 0; i < f.extras.length; i++){
        const e = f.extras[i];
        ctx.fillStyle = (i % 2) ? T.bld : T.bld2;
        ctx.fillRect(e.x, e.y, e.w, e.h);
        ctx.fillStyle = T.bld3; ctx.fillRect(e.x, e.y, e.w, 2);
      }
      // 能量管线
      ctx.strokeStyle = T.accent; ctx.globalAlpha = 0.35; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(r.x + 3, r.y + r.h * 0.5); ctx.lineTo(r.x + r.w - 3, r.y + r.h * 0.5); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(r.x + r.w * 0.5, r.y + 3); ctx.lineTo(r.x + r.w * 0.5, r.y + r.h - 3); ctx.stroke();
      ctx.globalAlpha = 0.7;
      const ph = (GS.frame * 0.02) % 1;
      ctx.fillStyle = '#fff';
      ctx.fillRect(r.x + 3 + (r.w - 6) * ph, r.y + r.h * 0.5 - 2, 5, 4);
      ctx.globalAlpha = 1;
      break;
    }
    case 'nebula': {
      const n = f.neb;
      const gg = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
      gg.addColorStop(0, 'rgba(120,90,210,' + n.a + ')');
      gg.addColorStop(0.55, 'rgba(60,40,150,' + (n.a * 0.5) + ')');
      gg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gg;
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, TAU); ctx.fill();
      // 小行星
      for (const e of f.extras){
        ctx.fillStyle = '#4a4a58';
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, TAU); ctx.fill();
        ctx.fillStyle = '#62627a';
        ctx.beginPath(); ctx.arc(e.x - e.r * 0.25, e.y - e.r * 0.25, e.r * 0.55, 0, TAU); ctx.fill();
      }
      break;
    }
  }
}

// ---------- 关卡脚本 ----------
const STAGE_LEN = 60 * 78;   // BOSS 出现时间

function buildStageScript(n, def){
  const ev = [];
  const rng = mulberry32(4021 + n * 7919);
  const D = stageDifficulty();
  function push(t, fn){ ev.push({ t: t, fn: fn }); }
  const R = function(a, b){ return a + rng() * (b - a); };

  function waveStream(t){
    const x = R(70, W - 70);
    for (let i = 0; i < 6; i++) push(t + i * 11, function(){ spawnPop(x + Math.sin(i * 1.7) * 26, -30, 0); });
  }
  function waveSnake(t){
    const x = R(90, W - 90), dir = rng() < 0.5 ? 1 : -1;
    for (let i = 0; i < 6; i++) push(t + i * 10, function(){ spawnPop(x, -30 - i * 26, 1, { dir: dir }); });
  }
  function waveSides(t){
    for (let i = 0; i < 5; i++){
      push(t + i * 12, function(){ spawnPop(-24, 70 + i * 34, 2, { dir: 1 }); });
      push(t + i * 12 + 6, function(){ spawnPop(W + 24, 70 + i * 34, 2, { dir: -1 }); });
    }
  }
  function waveV(t){
    const x = R(120, W - 120);
    for (let i = 0; i < 5; i++) push(t + i * 9, function(){ spawnPop(x + (i - 2) * 36, -30 - Math.abs(i - 2) * 26, 0); });
  }
  function waveHold(t){
    const x = R(80, W - 80);
    for (let i = 0; i < 4; i++) push(t + i * 14, function(){ spawnPop(x + (i - 1.5) * 30, -30, 3, { stopY: R(90, 190), waitT: 110 }); });
  }
  function waveDive(t){
    const x = R(60, W - 60);
    for (let i = 0; i < 6; i++) push(t + i * 15, function(){ spawnDive(x, -30 - i * 20, i * 4); });
  }
  function waveMedium(t, mode){
    const x = R(100, W - 100);
    for (let i = 0; i < 2; i++) push(t + i * 70, function(){ spawnMedium(x + (i ? 40 : -40), -40, { mode: mode || 0 }); });
  }
  function waveHeavy(t){
    const x = R(120, W - 120);
    push(t, function(){ spawnHeavy(x, -50); });
  }
  function waveTanks(t){
    const x = R(60, W - 160);
    for (let i = 0; i < 3; i++) push(t + i * 44, function(){ spawnTank(x + i * 46 + R(-14, 14)); });
  }
  function waveTurrets(t){
    const x = R(60, W - 190);
    for (let i = 0; i < 3; i++) push(t + i * 38, function(){ spawnTurret(x + i * 62); });
  }
  function waveBuildings(t){
    const x = R(60, W - 200);
    for (let i = 0; i < 4; i++) push(t + i * 26, function(){ spawnBuilding(x + i * 52, -40 - i * 20); });
  }
  function waveShip(t){
    push(t, function(){ spawnShip(R(120, W - 120)); });
  }
  function waveMix(t){
    const x = R(60, W - 100);
    for (let i = 0; i < 4; i++) push(t + i * 13, function(){ spawnPop(x, -30, 1); });
    push(t + 44, function(){ spawnTank(R(70, W - 70)); });
    push(t + 62, function(){ spawnTurret(R(70, W - 70)); });
  }

  const pool = [waveStream, waveSnake, waveSides, waveV, waveHold, waveDive, waveMix];
  const groundPool = [waveTanks, waveTurrets, waveBuildings];

  let t = 60;
  const endWave = STAGE_LEN - 60 * 8;
  let i = 0;
  const dens = DIFF().dens;
  while (t < endWave){
    if (i % 4 === 3){
      if (def.bg === 'sea') waveShip(t);
      else (groundPool[(rng() * groundPool.length) | 0])(t);
    } else if (i % 7 === 5){
      waveHeavy(t);
      if (D > 2 && rng() < 0.5) waveMedium(t + 50, 1);
    } else {
      (pool[(rng() * pool.length) | 0])(t);
    }
    // 额外波次仅在更高难度且概率更低时出现
    if (D >= 3 && rng() < (0.18 + D * 0.02) * dens) (pool[(rng() * pool.length) | 0])(t + 26);
    // 波次间隔: 低难度更长(更稀疏)
    t += Math.max(56, 108 - D * 5) + R(0, 34) + (1 - dens) * 55;
    i++;
  }
  push(60 * 40, function(){ spawnMidboss(R(140, W - 140)); });
  push(STAGE_LEN - 60 * 4, function(){ startBossWarn(def.boss); });
  ev.sort(function(a, b){ return a.t - b.t; });
  return ev;
}
// ============================================================
//  Part 08: 主更新循环 / 碰撞 / 道具 / 关卡流程 / 评价
// ============================================================

function updateGame(){
  GS.frame++;
  // 状态切换时清掉触摸拖动状态: 手指抬起事件可能落在旧界面上,
  // 否则残留的拖动坐标会把自机在新界面里一路拽到角落
  if (GS.state !== updateGame._last){
    updateGame._last = GS.state;
    touch.active = false; touch.tx = null; touch.ty = null; keys['KeyZ'] = false;
  }
  if (GS.shake > 0.3) GS.shake *= 0.9; else GS.shake = 0;
  if (GS.flash > 0) GS.flash--;

  // 静音切换(任意状态可用)
  if (tapped('KeyM')){ GS.muted = !GS.muted; muted = GS.muted; }
  // 操作说明(菜单类状态均可打开)
  if (tapped('KeyH') && (GS.state === 'title' || GS.state === 'diff' || GS.state === 'select' ||
      GS.state === 'gameover' || GS.state === 'ending')){
    GS.helpReturn = GS.state; GS.state = 'help'; S.select(); return;
  }
  capEntities();

  switch (GS.state){
    case 'title':    updateTitle(); return;
    case 'diff':     updateDiff(); return;
    case 'intro':    updateIntro(); return;
    case 'select':   updateSelect(); return;
    case 'help':     updateHelp(); return;
    case 'gameover': updateGameOver(); return;
    case 'ending':   updateEnding(); return;
  }

  // ---- clearwait ----
  if (GS.state === 'clearwait'){
    updateBackground();
    updateBullets();
    updateItems();
    updateParticles();
    if (--GS.clearTimer <= 0) nextStage();
    return;
  }

  // ---- play ----
  if (tapped('KeyP')) { GS.paused = !GS.paused; S.select(); }
  // 暂停中可查阅操作说明(返回后仍保持暂停)
  if (GS.paused && tapped('KeyH')){ GS.helpReturn = 'play'; GS.state = 'help'; S.select(); return; }
  if (GS.paused) return;

  GS.stageTime++;
  GS.stats.timeSec = (GS.stageTime / 60) | 0;
  GS.stats.totalTime++;

  // 脚本
  while (scriptIdx < stageScript.length && stageScript[scriptIdx].t <= GS.stageTime){
    stageScript[scriptIdx].fn();
    scriptIdx++;
  }
  // BOSS 警告 -> 出现
  if (GS.warnT > 0){
    GS.warnT--;
    if (GS.warnT === 70 && GS.pendingBoss){
      spawnBoss(GS.pendingBoss);
      GS.pendingBoss = null;
    }
  }

  updateBackground();
  updatePlayer();
  updateEnemies();
  if (boss) updateBoss();
  updateBomb();
  updateBullets();
  updateItems();
  updateParticles();
  collide();
}

// ---------- 标题 / 选择 ----------
function updateIntro(){
  updateBackground();
  updateParticles();
  GS.introT--;
  if (GS.introT <= 0 || tapped('KeyZ', 'Enter', 'Space')){ beginStagePlay(); }
}
function beginStagePlay(){
  GS.state = 'play';
  addText(W / 2, H / 2 - 40, stageDef.name, '#fff', 30, 150);
  addText(W / 2, H / 2 + 4, stageDef.sub, '#9ab', 15, 150);
}
function updateTitle(){
  updateBackground();
  updateParticles();
  if (tapped('Enter', 'KeyZ', 'Space')){ GS.state = 'diff'; S.decide(); }
}
// 操作说明页: 任意返回键回到来源状态
function updateHelp(){
  updateBackground();
  if (tapped('KeyH', 'Escape', 'Enter', 'KeyZ', 'Space')){
    GS.state = GS.helpReturn || 'title';
    S.decide();
  }
}
function updateDiff(){
  updateBackground();
  // 难度是垂直列表: 上/左 = 上一个, 下/右 = 下一个 (回绕)
  // 原实现把四个方向键都绑成 +1, 导致按上也是往下走
  if (tapped('ArrowUp', 'KeyW', 'ArrowLeft', 'KeyA')){
    GS.diff = (GS.diff + DIFFS.length - 1) % DIFFS.length; S.select();
  } else if (tapped('ArrowDown', 'KeyS', 'ArrowRight', 'KeyD')){
    GS.diff = (GS.diff + 1) % DIFFS.length; S.select();
  }
  if (tapped('Enter', 'KeyZ', 'Space')){ GS.state = 'select'; S.decide(); }
  if (tapped('Escape')){ GS.state = 'title'; }
}
function updateSelect(){
  updateBackground();
  if (tapped('ArrowLeft', 'KeyA')){ GS.selIdx = (GS.selIdx + PLANES.length - 1) % PLANES.length; S.select(); }
  if (tapped('ArrowRight', 'KeyD')){ GS.selIdx = (GS.selIdx + 1) % PLANES.length; S.select(); }
  if (tapped('ArrowUp', 'KeyW')){ GS.selIdx = (GS.selIdx + PLANES.length - 3) % PLANES.length; S.select(); }
  if (tapped('ArrowDown', 'KeyS')){ GS.selIdx = (GS.selIdx + 3) % PLANES.length; S.select(); }
  if (tapped('Enter', 'KeyZ', 'Space')){ startGame(GS.selIdx); S.decide(); }
  if (tapped('Escape')){ GS.state = 'diff'; }
}
function updateGameOver(){
  updateBackground();
  updateParticles();
  if (tapped('KeyR', 'Enter', 'KeyZ')){ backToTitle(); }
}
function backToTitle(){
  clearEntities();
  GS.state = 'title';
  GS.paused = false;
  bg = makeBackground('sea');
  S.decide();
}
function updateEnding(){
  updateBackground();
  updateParticles();
  if (tapped('KeyR', 'Enter', 'KeyZ')){
    if (GS.loopNum < 2) startNextLoop();
    else backToTitle();
  }
}

// ---------- 关卡推进 ----------
function nextStage(){
  // 刚清完的是本周目最后一关?
  if (stageIndex(GS.stageNum) === stageOrder.length - 1){
    finalizeGrade();
    GS.state = 'ending';
    S.stageClear();
    return;
  }
  GS.stageNum++;
  loadStage(GS.stageNum);
  GS.state = 'intro';
  GS.introT = 170;
}
function startNextLoop(){
  GS.loopNum++;
  GS.stageNum++;
  stageOrder = makeStageOrder();
  loadStage(GS.stageNum);
  GS.state = 'intro';
  GS.introT = 200;
  GS.loopBanner = true;
}

// ---------- 子弹 ----------
function updateBullets(){
  const enemiesAll = enemies;
  for (const b of pbullets){
    b.t++;
    if (b.hom){
      let best = null, bd = 1e9;
      for (const e of enemiesAll){
        if (e.dead || e.gone) continue;
        const d = dist2(b.x, b.y, e.x, e.y);
        if (d < bd){ bd = d; best = e; }
      }
      if (boss && !best){
        for (const p of boss.parts){ if (p.dead) continue; const d = dist2(b.x, b.y, p.x, p.y); if (d < bd){ bd = d; best = p; } }
      }
      if (best){
        const a = Math.atan2(best.y - b.y, best.x - b.x);
        const cur = Math.atan2(b.vy, b.vx);
        const turn = b.hom === 2 ? 0.13 : 0.075;
        const spd = Math.hypot(b.vx, b.vy);
        const na = cur + clamp(angDiff(a, cur), -turn, turn);
        b.vx = Math.cos(na) * spd; b.vy = Math.sin(na) * spd;
      }
    }
    b.x += b.vx; b.y += b.vy;
    if (b.t > b.life) b.dead = true;
  }
  pbullets = pbullets.filter(function(b){
    return !b.dead && b.y > -60 && b.y < H + 60 && b.x > -80 && b.x < W + 80;
  });
  for (const b of ebullets){
    b.t++;
    b.x += b.vx; b.y += b.vy;
    if (b.kind === 1) b.vx += b.ax || 0;
  }
  ebullets = ebullets.filter(function(b){
    return !b.dead && b.y > -50 && b.y < H + 50 && b.x > -50 && b.x < W + 50;
  });
}

// ---------- 道具 ----------
function updateItems(){
  const p = player;
  const alive = p && !p.dead;
  for (const it of items){
    it.t++;
    if (it.kind === ITEM.GOLD || it.kind === ITEM.GOLD_BIG){
      // 0 亮(30帧) / 1 暗(22帧) —— 亮窗略长, 熟练可稳定连锁
      const ph = (it.t + it.phase) % 52;
      it.blink = ph < 30 ? 0 : 1;
    }
    if (it.t < 34){
      it.vy += 0.13; it.x += it.vx; it.y += it.vy;
      it.vx *= 0.98;
    } else {
      it.y += it.kind === ITEM.GOLD || it.kind === ITEM.GOLD_BIG ? 1.7 : 1.9;
      it.x += Math.sin(it.t * 0.05) * 0.5;
    }
    if (alive){
      const d2 = dist2(it.x, it.y, p.x, p.y);
      const mag = it.kind === ITEM.P || it.kind === ITEM.B ? 62 : 34;
      if (d2 < mag * mag){
        const a = Math.atan2(p.y - it.y, p.x - it.x);
        const pull = it.kind === ITEM.P || it.kind === ITEM.B ? 7.5 : 6;
        it.x += Math.cos(a) * pull; it.y += Math.sin(a) * pull;
      }
      if (d2 < 19 * 19){
        it.dead = true;
        collectItem(it);
        continue;
      }
    }
    if (it.y > H + 24) it.dead = true;
  }
  items = items.filter(function(i){ return !i.dead; });
}
function collectItem(it){
  switch (it.kind){
    case ITEM.P: {
      if (GS.power < MAX_POWER){
        GS.power++;
        S.powerup();
        addText(it.x, it.y, 'POWER UP!', '#7dffb0', 14, 45);
      } else {
        addScore(1000); S.powerup();
        addText(it.x, it.y, '1000', '#7dffb0', 12, 36);
      }
      break;
    }
    case ITEM.B: {
      if (GS.bombs < 9){ GS.bombs++; S.bombReady(); addText(it.x, it.y, 'BOMB!', '#ff9e3d', 14, 45); }
      else { addScore(2000); addText(it.x, it.y, '2000', '#ff9e3d', 12, 36); }
      break;
    }
    case ITEM.LIFE: {
      GS.lives++; S.extend(); addText(it.x, it.y, '1UP!', '#ffd24a', 18, 70);
      break;
    }
    case ITEM.GOLD: case ITEM.GOLD_BIG: {
      const bright = it.blink === 0;
      const idx = clamp(GS.medalValue, 0, GOLD_CHAIN.length - 1);
      const v = GOLD_CHAIN[idx];
      addScore(v);
      GS.goldCnt++;
      GS.goldPoints += v;
      if (bright){
        S.medal(v);
        addText(it.x, it.y, String(v), '#ffd24a', 15, 40);
        GS.medalValue = Math.min(GOLD_CHAIN.length - 1, idx + 1);
        if (idx + 1 < GOLD_CHAIN.length && idx >= 2) addText(it.x, it.y - 16, 'CHAIN ' + GOLD_CHAIN[idx + 1], '#fff3c0', 10, 30);
      } else {
        S.medalDull();
        addText(it.x, it.y, String(v), '#a89a68', 12, 32);
        // 断链提示只在真的断了(≥2档)时显示, 避免炸弹清屏时刷屏
        if (GS.medalValue >= 2) addText(it.x, it.y - 16, 'CHAIN BREAK', '#ff8080', 10, 34);
        GS.medalValue = 0;
      }
      break;
    }
  }
}
function resetGoldChain(){ GS.medalValue = 0; }

// ---------- 粒子/文字 ----------
function updateParticles(){
  for (const q of parts){
    q.t++;
    q.x += q.vx; q.y += q.vy;
    q.vx *= 0.955; q.vy *= 0.955;
    if (q.kind === 'smoke') q.vy -= 0.02;
  }
  parts = parts.filter(function(q){ return q.t < q.life; });
  for (const tx of texts){ tx.t++; tx.y += tx.vy; }
  texts = texts.filter(function(t){ return t.t < t.life; });
}

// ---------- 碰撞 ----------
function collide(){
  const p = player;
  // 自机弹 vs 敌机
  for (const b of pbullets){
    if (b.dead) continue;
    for (const e of enemies){
      if (e.dead || e.gone) continue;
      const rr = b.r + e.r;
      if (dist2(b.x, b.y, e.x, e.y) < rr * rr){
        smallExplosion(b.x, b.y - 4, '#ffe86a');
        if (!b.hit){ b.hit = true; GS.stats.hits++; }
        damageEnemy(e, b.dmg, b);
        if (!b.pierce) b.dead = true;
        break;
      }
    }
    if (b.dead) continue;
    if (boss && boss.dying === 0 && boss.morphing === 0 && !boss.enter){
      const shielded = bossCoreShielded();
      // 装甲覆盖中的核心: 子弹穿过, 只留弹开火花
      if (shielded && boss.core){
        const rr = b.r + boss.core.r + 10;
        if (dist2(b.x, b.y, boss.core.x, boss.core.y) < rr * rr){
          boss.core.shieldFx = 4;
          if (GS.frame % 4 === 0){
            const a = rand(0, TAU);
            parts.push({ x: b.x, y: b.y, vx: Math.cos(a) * 2.4, vy: Math.sin(a) * 2.4 - 1, t: 0, life: 11, col: '#9fe8ff', r: 2.2, kind: 'spark' });
            S.hitArmor();
          }
        }
      }
      // 命中最近的部件(处理判定框重叠), 装甲核心不参与
      let best = null, bd = 1e9;
      for (const bp2 of boss.parts){
        if (bp2.dead) continue;
        if (bp2.isCore && shielded) continue;
        const rr = b.r + bp2.r;
        const d2 = dist2(b.x, b.y, bp2.x, bp2.y);
        if (d2 < rr * rr && d2 < bd){ bd = d2; best = bp2; }
      }
      if (best){
        smallExplosion(b.x, b.y - 4, '#ffe86a');
        if (!b.hit){ b.hit = true; GS.stats.hits++; }
        bossPartDamage(best, b.dmg);
        if (!b.pierce) b.dead = true;
      }
    }
  }
  pbullets = pbullets.filter(function(b){ return !b.dead; });

  if (!p || p.dead || GS.state !== 'play') return;

  // 擦弹(kissing): 贴近敌弹但不被弹中(无视无敌, 便于测试与练习)
  if (p.invul <= 0 && bombInvul <= 0 && !bombAct){
    const gr = 20;
    for (const b of ebullets){
      if (b.dead || b.grazed) continue;
      const rr = gr + b.r;
      const d2 = dist2(b.x, b.y, p.x, p.y);
      if (d2 < rr * rr && d2 > (3.2 + b.r * 0.82) * (3.2 + b.r * 0.82)){
        b.grazed = 1;
        GS.graze++;
        GS.grazeChain++;
        GS.grazeChainT = 90;
        addScore(60);
        // 擦弹累积蓄力
        if (p.gauge < 180) p.gauge = Math.min(180, p.gauge + 3.2);
        if (GS.frame % 3 === 0){
          const a = Math.atan2(p.y - b.y, p.x - b.x);
          parts.push({ x: b.x + Math.cos(a) * b.r, y: b.y + Math.sin(a) * b.r, vx: Math.cos(a) * 2.4, vy: Math.sin(a) * 2.4, t: 0, life: 14, col: '#8fe8ff', r: 1.9, kind: 'spark' });
        }
        if (GS.grazeChain % 20 === 0){
          addText(p.x + rand(-16, 16), p.y - 26, 'GRAZE x' + GS.grazeChain, '#8fe8ff', 13, 40);
          S.hit();
        }
      }
    }
  }
  if (GS.noDamage) return;
  // 自机判定(极小判定点)
  const hitR = 3.2;
  if (p.invul <= 0 && bombInvul <= 0 && !bombAct){
    for (const b of ebullets){
      if (b.dead) continue;
      const rr = hitR + b.r * 0.82;
      if (dist2(b.x, b.y, p.x, p.y) < rr * rr){
        b.dead = true;
        playerHitByBullet();
        return;
      }
    }
    for (const e of enemies){
      if (e.dead || e.gone) continue;
      const rr = hitR + e.r * 0.62;
      if (dist2(e.x, e.y, p.x, p.y) < rr * rr){ playerHitByEnemy(e.type); return; }
    }
    if (boss && boss.dying === 0 && boss.morphing === 0 && !boss.enter){
      for (const bp2 of boss.parts){
        if (bp2.dead) continue;
        const rr = hitR + bp2.r * 0.7;
        if (dist2(bp2.x, bp2.y, p.x, p.y) < rr * rr){ playerHitByEnemy('boss:' + bp2.key); return; }
      }
    }
  }
}

// ---------- 结算评价 ----------
function finalizeGrade(){
  const st = GS.stats;
  const acc = st.shots > 0 ? st.hits / st.shots : 0;
  // 三项奖牌: TIME / GOLD / SHOT DOWN
  const times = st.stageTimes || [];
  let t = 0;
  if (times.length){ for (const v of times) t += v; t /= times.length; }
  else t = GS.stageTime / 60;
  const timeMedal = t < 135 ? 2 : (t < 210 ? 1 : 0);
  const goldMedal = GS.goldPoints > 90000 ? 2 : (GS.goldPoints > 40000 ? 1 : 0);
  const escRatio = st.spawned > 0 ? st.esc / st.spawned : 1;
  const killMedal = escRatio < 0.08 ? 2 : (escRatio < 0.22 ? 1 : 0);
  GS.grade = {
    time: timeMedal, gold: goldMedal, kill: killMedal,
    total: timeMedal + goldMedal + killMedal,
    esc: st.esc, escRatio: escRatio, spawned: st.spawned, acc: acc,
    goldPoints: GS.goldPoints, goldCnt: GS.goldCnt,
    deaths: st.deaths, kills: st.kills, bombs: st.bombsUsed, charges: st.chargeUsed,
    loop: GS.loopNum, stage: GS.stageNum, avgStageTime: Math.round(t), stages: times.length,
    graze: GS.graze, grazeBest: GS.grazeBest
  };
  save.medals = Math.max(save.medals, GS.grade.total);
  save.gold = Math.max(save.gold, GS.goldPoints);
  if (GS.stageNum >= stageOrder.length && GS.loopNum >= 1) save.clear = Math.max(save.clear, 1);
  saveGame();
  S.grade();
}
// ============================================================
//  Part 09: 渲染 —— 自机 / 敌机 / BOSS / 弹幕 / HUD / 界面
//  16bit 街机风格: 硬边矩形像素块 + 受限调色板 + 硬黑轮廓
// ============================================================

function render(){
  ctx.save();
  clearTapZones();   // 可点区域每帧重建, 只反映当前屏幕
  if (GS.shake > 0.4){
    const s = GS.shake * 0.35;
    ctx.translate(Math.round(rand(-s, s)), Math.round(rand(-s, s)));
  }
  switch (GS.state){
    case 'title': drawTitleScreen(); break;
    case 'diff': drawDiffScreen(); break;
    case 'select': drawSelectScreen(); break;
    case 'help': drawHelpScreen(); break;
    case 'intro': drawIntroScreen(); break;
    case 'gameover': drawGameWorld(); drawGameOverScreen(); break;
    case 'ending': drawGameWorld(); drawEndingScreen(); break;
    default: drawGameWorld(); drawHud(); break;
  }
  ctx.restore();

  // 闪白
  if (GS.flash > 0){
    ctx.globalAlpha = Math.min(0.72, GS.flash / 18);
    ctx.fillStyle = GS.flashCol;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
  // 扫描线(CRT 质感) — 与像素块节奏对齐
  ctx.globalAlpha = 0.09;
  ctx.fillStyle = '#000';
  for (let y = 0; y < H; y += 2) ctx.fillRect(0, y, W, 1);
  ctx.globalAlpha = 1;
  // 暗角
  if (!render._vig){
    const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.36, W / 2, H / 2, H * 0.8);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,0.6)');
    render._vig = g;
  }
  ctx.fillStyle = render._vig;
  ctx.fillRect(0, 0, W, H);
}

function drawGameWorld(){
  if (!bg) bg = makeBackground('city');
  drawBackground();
  drawGroundUnits();
  drawEnemies();
  drawBoss();
  drawItems();
  drawPlayerBullets();
  drawChargeFx();
  drawPlayerShip();
  drawEnemyBullets();
  drawBombEffects();
  drawParticles();
  drawTexts();
  if (GS.warnT > 0) drawBossWarn();
  if (GS.state === 'clearwait') drawStageClearScreen();
  if (GS.paused && GS.state === 'play') drawPauseScreen();
}

// ---------- 自机 ----------
function drawPlayerShip(){
  const p = player;
  if (!p) return;
  if (p.dead) return;
  const blink = p.invul > 0 && (GS.frame % 6 < 3);
  const P = p.P;
  ctx.save();
  ctx.translate(p.x, p.y);
  if (blink) ctx.globalAlpha = 0.45;
  drawShipShape(ctx, P, p.bank, 1);
  ctx.restore();

  // 判定点(彩京式极小判定) — 像素方块
  if (!blink){
    const pr = 4 + ((GS.frame >> 2) % 2);
    px(ctx, p.x - pr - 1, p.y - pr - 1, pr * 2 + 2, pr * 2 + 2, '#ffffff');
    px(ctx, p.x - pr, p.y - pr, pr * 2, pr * 2, '#ff2050');
    px(ctx, p.x - pr + 1, p.y - pr + 1, pr, pr, '#ffffff');
  }
  // 蓄力环(像素点阵)
  if (p.gauge > 0){
    const gr = p.gauge / 180;
    const col = gr >= 1 ? '#ff4060' : P.col;
    const R = 24 + (gr >= 1 ? Math.sin(GS.frame * 0.4) * 4 : 0);
    const segs = Math.round(gr * 20);
    ctx.globalAlpha = gr >= 1 ? 0.95 : 0.7;
    for (let i = 0; i < segs; i++){
      const a = -HPI + i / 20 * TAU;
      px(ctx, p.x + Math.cos(a) * R - 1.5, p.y + Math.sin(a) * R - 1.5, 3, 3, col);
    }
    ctx.globalAlpha = 1;
    if (gr >= 1){
      for (let i = 0; i < 16; i++){
        const a = i / 16 * TAU + GS.frame * 0.05;
        px(ctx, p.x + Math.cos(a) * (R + 5) - 1, p.y + Math.sin(a) * (R + 5) - 1, 2, 2, '#ffffff');
      }
    }
  }
  // 子机(像素战机)
  const opts = playerOptPositions(p);
  for (let i = 0; i < opts.length; i++){
    const o = opts[i];
    ctx.save(); ctx.translate(Math.round(o.x), Math.round(o.y));
    if (blink) ctx.globalAlpha = 0.45;
    const spinning = p.chargeFx && (p.chargeFx.kind === 'drill' || p.chargeFx.kind === 'drillSpin');
    if (spinning) ctx.rotate(p.optPhase * 2.2);
    const c0 = '#0b0b12';
    px(ctx, -9, -11, 18, 22, c0);
    px(ctx, -8, -10, 16, 18, P.col2);
    px(ctx, -6, -8, 12, 14, P.col);
    px(ctx, -4, -6, 3, 10, P.col3 || '#ffffff');
    px(ctx, -2, -3, 4, 6, c0);
    px(ctx, -1, -2, 2, 3, '#7fd8f0');
    px(ctx, -4, 9, 3, 4, '#ffd24a');
    px(ctx, 1, 9, 3, 4, '#ffd24a');
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}
// 俯视战机: 硬边像素块拼贴(16bit 街机风格)
// 用矩形块 + 硬黑轮廓, 不使用曲线/渐变
function px(g, x, y, w, h, col){
  g.fillStyle = col;
  g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}
function drawShipShape(g, P, bank, scale){
  g.save();
  if (scale && scale !== 1) g.scale(scale, scale);
  g.rotate((bank || 0) * 0.5);
  const c0 = '#0b0b12';          // 硬黑轮廓
  const c1 = P.col2;             // 暗部
  const c2 = P.col;              // 主色
  const c3 = P.col3 || '#fff';   // 高光
  // ---- 硬黑轮廓层(外扩 1px) ----
  px(g, -27, 6, 54, 6, c0);
  px(g, -16, -6, 32, 22, c0);
  px(g, -8, -21, 16, 34, c0);
  px(g, -12, 11, 24, 6, c0);
  // ---- 主翼(前掠, 阶梯状) ----
  px(g, -26, 7, 12, 5, c1);
  px(g, -20, 3, 10, 5, c1);
  px(g, -15, -1, 10, 5, c1);
  px(g, 14, 7, 12, 5, c1);
  px(g, 10, 3, 10, 5, c1);
  px(g, 5, -1, 10, 5, c1);
  // 翼上高光
  px(g, -24, 7, 10, 3, c2);
  px(g, -18, 3, 8, 3, c2);
  px(g, 14, 7, 10, 3, c2);
  px(g, 10, 3, 8, 3, c2);
  // 翼端识别色
  px(g, -26, 7, 3, 5, c3);
  px(g, 23, 7, 3, 5, c3);
  // ---- 尾翼 ----
  px(g, -12, 12, 8, 5, c1);
  px(g, 4, 12, 8, 5, c1);
  px(g, -11, 13, 6, 3, c2);
  px(g, 5, 13, 6, 3, c2);
  // ---- 机身(纵向阶梯) ----
  px(g, -6, 6, 12, 8, c2);
  px(g, -5, 0, 10, 7, c2);
  px(g, -4, -8, 8, 9, c2);
  px(g, -3, -14, 6, 7, c2);
  px(g, -2, -19, 4, 6, c2);
  // 机身暗侧(右) / 亮侧(左)
  px(g, 3, 6, 3, 8, c1);
  px(g, 2, 0, 3, 7, c1);
  px(g, 1, -8, 3, 9, c1);
  px(g, 2, -14, 2, 7, c1);
  px(g, -6, 6, 2, 8, c3);
  px(g, -5, 0, 2, 7, c3);
  px(g, -4, -8, 2, 9, c3);
  // ---- 座舱(2x2 像素块) ----
  px(g, -2, -7, 4, 5, '#0b0b12');
  px(g, -1, -6, 2, 3, '#7fd8f0');
  px(g, -1, -6, 1, 1, '#d8f6ff');
  // ---- 引擎口 ----
  px(g, -5, 14, 3, 2, '#2a2a38');
  px(g, 2, 14, 3, 2, '#2a2a38');
  // ---- 引擎焰(像素三角, 帧动画) ----
  const f1 = 3 + ((GS.frame >> 1) % 3) * 2;
  const f2 = 2 + ((GS.frame >> 1) % 2) * 2;
  px(g, -4, 16, 3, f1, '#ffd24a');
  px(g, 1, 16, 3, f1, '#ffd24a');
  px(g, -3, 16, 1, f2, '#fff6d0');
  px(g, 2, 16, 1, f2, '#fff6d0');
  g.restore();
}

// ---------- 蓄力攻击视觉 ----------
function drawChargeFx(){
  const p = player;
  if (!p || !p.chargeFx) return;
  const fx = p.chargeFx, P = fx.P;
  ctx.save();
  switch (fx.kind){
    case 'wall': {
      const cx = fx.fx, cy = fx.fy;
      const a = fx.t < 10 ? fx.t / 10 : (fx.t > fx.life - 16 ? (fx.life - fx.t) / 16 : 1);
      // 光束列
      ctx.globalAlpha = a * 0.4;
      for (let i = 0; i < 5; i++){
        px(ctx, cx - 44 + i * 20, 0, 9, cy, P.col);
        px(ctx, cx - 42 + i * 20, 0, 4, cy, P.col3 || '#fff');
      }
      // 子机壁垒(像素战机)
      ctx.globalAlpha = a;
      for (let i = 0; i < 5; i++){
        const x = cx - 40 + i * 20;
        ctx.save(); ctx.translate(Math.round(x), Math.round(cy));
        const c0 = '#0b0b12';
        px(ctx, -10, -12, 20, 24, c0);
        px(ctx, -9, -11, 18, 20, P.col2);
        px(ctx, -7, -9, 14, 16, P.col);
        px(ctx, -5, -7, 4, 12, P.col3 || '#fff');
        px(ctx, -2, -4, 4, 6, c0);
        px(ctx, -1, -3, 2, 3, '#7fd8f0');
        px(ctx, -4, 11, 3, 4, '#ffd24a');
        px(ctx, 1, 11, 3, 4, '#ffd24a');
        ctx.restore();
      }
      break;
    }
    case 'drill': {
      const cx = Math.round(p.x), cy = Math.round(p.y - 34);
      const R = 30 + Math.sin(fx.t * 0.3) * 6;
      ctx.globalAlpha = 0.85;
      // 像素旋转刃(用矩形段拼出弧线)
      for (let i = 0; i < 3; i++){
        const a0 = fx.ang + i * TAU / 3;
        for (let k = 0; k < 8; k++){
          const aa = a0 + k * 0.22;
          px(ctx, cx + Math.cos(aa) * R - 3, cy + Math.sin(aa) * R - 3, 6, 6, k % 2 ? P.col3 || '#fff' : P.col);
        }
      }
      break;
    }
    case 'wallDiag': {
      const cx = Math.round(p.x), cy = Math.round(p.y - 40);
      ctx.globalAlpha = 0.85;
      for (let i = 0; i < 5; i++){
        const off = i * 17;
        const col = i % 2 ? (P.col3 || '#fff') : P.col;
        const lx = cx - 36 - off * 0.4, rx = cx + 36 + off * 0.4, yy = cy - 40 - i * 20;
        px(ctx, lx - 1, yy - 1, 7, 46, '#0b0b12');
        px(ctx, rx - 1, yy - 1, 7, 46, '#0b0b12');
        px(ctx, lx, yy, 5, 44, col);
        px(ctx, rx, yy, 5, 44, col);
        px(ctx, lx + 1, yy, 2, 44, '#ffffff');
        px(ctx, rx + 1, yy, 2, 44, '#ffffff');
      }
      break;
    }
    case 'drillSpin': {
      const R = 46;
      ctx.globalAlpha = 0.9;
      // 像素弧段
      for (let i = 0; i < 2; i++){
        const a0 = fx.ang + i * PI;
        for (let k = 0; k < 14; k++){
          const aa = a0 + k * 0.16;
          px(ctx, p.x + Math.cos(aa) * R - 3, p.y + Math.sin(aa) * R - 3, 6, 6, k % 3 === 0 ? '#ffffff' : P.col);
        }
      }
      break;
    }
    case 'homing': {
      const r = 18 + Math.sin(fx.t * 0.35) * 6;
      ctx.globalAlpha = 0.65;
      for (let i = 0; i < 14; i++){
        const a = i / 14 * TAU + fx.t * 0.04;
        px(ctx, p.x + Math.cos(a) * r - 1.5, p.y - 12 + Math.sin(a) * r - 1.5, 3, 3, P.col);
      }
      break;
    }
    case 'sideLine': {
      const yy = Math.round(p.y - 30 - (fx.shots % 6) * 24);
      ctx.globalAlpha = 0.55;
      // 像素横向光带
      for (let i = 0; i < 5; i++){
        px(ctx, 0, yy - 26 + i * 13, W, 10, i === 2 ? (P.col3 || '#fff') : P.col);
      }
      ctx.globalAlpha = 0.9;
      px(ctx, 0, yy - 3, W, 6, '#ffffff');
      break;
    }
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

// ---------- 玩家子弹 ----------
function drawPlayerBullets(){
  for (const b of pbullets){
    if (b.big){
      ctx.fillStyle = b.col;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.5, 0, TAU); ctx.fill();
      continue;
    }
    switch (b.kind){
      case 'missile': case 'grenade': {
        const a = Math.atan2(b.vy, b.vx) + HPI;
        ctx.save(); ctx.translate(Math.round(b.x), Math.round(b.y)); ctx.rotate(a);
        const c0 = '#0b0b12';
        px(ctx, -6, -10, 12, 20, c0);
        px(ctx, -5, -9, 10, 18, b.col);
        px(ctx, -4, -8, 4, 12, '#ffffff');
        px(ctx, -3, 8, 6, 4, '#ffd24a');
        px(ctx, -2, 11, 4, 5, '#ff8833');
        ctx.restore();
        break;
      }
      case 'aimshot': {
        ctx.save(); ctx.translate(Math.round(b.x), Math.round(b.y)); ctx.rotate(Math.atan2(b.vy, b.vx) + HPI);
        px(ctx, -4, -9, 8, 18, '#0b0b12');
        px(ctx, -3, -8, 6, 16, b.col);
        px(ctx, -1, -8, 2, 16, '#ffffff');
        ctx.restore();
        break;
      }
      default: {
        // 像素椭圆弹: 外光 + 硬轮廓 + 白心
        const R = Math.round(b.r);
        ctx.globalAlpha = 0.3;
        px(ctx, b.x - R * 0.9, b.y - R * 1.8, R * 1.8, R * 3.6, b.col);
        ctx.globalAlpha = 1;
        px(ctx, b.x - R * 0.5 - 1, b.y - R * 1.5 - 1, R + 2, R * 3 + 2, '#0b0b12');
        px(ctx, b.x - R * 0.5, b.y - R * 1.5, R, R * 3, b.col);
        px(ctx, b.x - R * 0.28, b.y - R * 1.2, R * 0.56, R * 2.4, '#ffffff');
      }
    }
  }
}

// ---------- 敌弹 ----------
function drawEnemyBullets(){
  for (const b of ebullets){
    const R = Math.round(b.r);
    // 硬轮廓 + 实心 + 左上高光(经典 16bit 弹)
    px(ctx, b.x - R - 1.5, b.y - R - 1.5, R * 2 + 3, R * 2 + 3, '#0b0b12');
    px(ctx, b.x - R - 0.5, b.y - R - 0.5, R * 2 + 1, R * 2 + 1, '#ffffff');
    px(ctx, b.x - R, b.y - R, R * 2, R * 2, b.col);
    px(ctx, b.x - R + 1, b.y - R + 1, R * 0.9, R * 0.9, '#ffffff');
  }
}

// ---------- 敌机 ----------
// 俯视二战机体, 受击时提亮而非纯白
function drawEnemies(){
  for (const e of enemies){
    if (e.dead || e.ground) continue;
    const h = e.hitFlash > 0;
    ctx.save(); ctx.translate(e.x, e.y);
    switch (e.type){
      case 'pop': case 'dive': {
        if (e.type === 'dive' && e.dived) ctx.rotate(Math.atan2(e.vy, e.vx) - HPI);
        const c0 = '#0b0b12';
        const base = h ? lighten('#8e3a44', 0.22) : '#8e3a44';
        const dark = h ? lighten('#6a2830', 0.22) : '#6a2830';
        const lite = h ? lighten('#b85862', 0.22) : '#b85862';
        // 硬黑轮廓
        px(ctx, -16, -3, 32, 8, c0);
        px(ctx, -6, -10, 12, 26, c0);
        px(ctx, -8, -14, 16, 5, c0);
        // 主翼(阶梯像素块)
        px(ctx, -15, -1, 7, 5, dark);
        px(ctx, -11, 2, 7, 5, dark);
        px(ctx, 8, -1, 7, 5, dark);
        px(ctx, 4, 2, 7, 5, dark);
        px(ctx, -14, -1, 5, 3, base);
        px(ctx, 9, -1, 5, 3, base);
        // 尾翼
        px(ctx, -8, -14, 4, 4, dark);
        px(ctx, 4, -14, 4, 4, dark);
        // 机身(纵向)
        px(ctx, -4, -8, 8, 24, base);
        px(ctx, -4, -8, 2, 24, lite);
        px(ctx, 2, -8, 2, 24, dark);
        px(ctx, -3, -12, 6, 5, base);
        // 座舱

function drawGroundUnits(){
  for (const e of enemies){
    if (!e.ground || e.dead) continue;
    ctx.save(); ctx.translate(e.x, e.y);
    const h = e.hitFlash > 0;
    if (e.type === 'tank'){
      const c0 = '#0b0b12';
      const base = h ? lighten('#48582f', 0.25) : '#48582f';
      const lite = h ? lighten('#5c7040', 0.25) : '#5c7040';
      const dark = h ? lighten('#33401f', 0.25) : '#33401f';
      px(ctx, -19, -12, 7, 26, c0);
      px(ctx, 12, -12, 7, 26, c0);
      px(ctx, -18, -11, 5, 24, '#2a3320');
      px(ctx, 13, -11, 5, 24, '#2a3320');
      px(ctx, -18, -13, 36, 27, c0);
      px(ctx, -16, -11, 32, 23, base);
      px(ctx, -16, -11, 32, 8, lite);
      px(ctx, -16, 6, 32, 6, dark);
      px(ctx, -10, -10, 20, 20, c0);
      px(ctx, -8, -8, 16, 16, dark);
      px(ctx, -6, -6, 12, 12, base);
      const a = e.aim || aimAngle(e.x, e.y, 0);
      ctx.save(); ctx.rotate(a);
      px(ctx, 0, -3, 20, 6, c0);
      px(ctx, 0, -2, 18, 4, dark);
      ctx.restore();
    } else if (e.type === 'turret'){
      const c0 = '#0b0b12';
      const base = h ? lighten('#6a6a58', 0.25) : '#6a6a58';
      const dark = h ? lighten('#4e4e40', 0.25) : '#4e4e40';
      px(ctx, -16, -10, 32, 20, c0);
      px(ctx, -10, -16, 20, 32, c0);
      px(ctx, -14, -8, 28, 16, base);
      px(ctx, -8, -14, 16, 28, base);
      px(ctx, -10, -10, 20, 20, dark);
      px(ctx, -8, -8, 16, 16, base);
      const a2 = e.aim || aimAngle(e.x, e.y, 0);
      ctx.save(); ctx.rotate(a2);
      px(ctx, 0, -4, 22, 8, c0);
      px(ctx, 0, -3, 20, 6, dark);
      px(ctx, 0, -1, 20, 2, '#9a9a88');
      ctx.restore();
    } else if (e.type === 'building'){
      const c0 = '#0b0b12';
      const base = h ? lighten('#8a8070', 0.25) : '#8a8070';
      const dark = h ? lighten('#6e6558', 0.25) : '#6e6558';
      px(ctx, -20, -18, 40, 36, c0);
      px(ctx, -18, -16, 36, 32, base);
      px(ctx, -18, -16, 36, 10, dark);
      px(ctx, -18, -16, 36, 2, '#b8ae9c');
      for (let i = 0; i < 3; i++) for (let j = 0; j < 2; j++) px(ctx, -12 + i * 10, -4 + j * 9, 5, 5, '#ffdc8c');
      px(ctx, -4, -4, 8, 8, c0);
      px(ctx, -3, -3, 6, 6, '#ffd24a');
    }
    ctx.restore();
  }
}

};
function drawBoss(){
  const b = boss;
  if (!b) return;
  const h = b.hitFlash > 0;
  ctx.save();
  ctx.translate(b.x, b.y);
  if (b.dying > 0) ctx.globalAlpha = 0.6 + Math.sin(GS.frame * 0.7) * 0.35;
  if (b.morphing > 0){
    ctx.globalAlpha = 0.5 + Math.sin(GS.frame * 0.9) * 0.45;
    const k = 1 + Math.sin(b.morph * PI) * 0.05;
    ctx.scale(k, k);
  }
  drawBossShape(b, h);
  if (b.core) drawBossCore(b, b.core);
  ctx.globalAlpha = 1;
  ctx.restore();

  // 部件绘制在核心之上, 保证可读性
  for (const p of b.parts){
    if (p.isCore) continue;
    ctx.save(); ctx.translate(p.x, p.y);
    drawBossPart(b, p);
    ctx.restore();
  }

}

      ctx.beginPath(); ctx.ellipse(0, 0, 80, 46, 0, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 2;
      for (let i = -2; i <= 2; i++){ ctx.beginPath(); ctx.moveTo(i * 27, -36); ctx.lineTo(i * 35, 48); ctx.stroke(); }
      // 棘刺
      ctx.fillStyle = '#3a2438';
      for (let i = 0; i < 7; i++){
        const a = -PI * 0.85 + i * (PI * 0.85 * 2 / 6);
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * 96, Math.sin(a) * 56 + 6);
        ctx.lineTo(Math.cos(a) * 116, Math.sin(a) * 70 + 6);
        ctx.lineTo(Math.cos(a + 0.14) * 96, Math.sin(a + 0.14) * 56 + 6);
        ctx.closePath(); ctx.fill();
      }
      break;
    }
    case 'cany': {
      ctx.fillStyle = 'rgba(0,0,0,0.36)';
      ctx.beginPath(); ctx.ellipse(8, 14, 106, 86, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = h ? lighten(M.base, 0.24) : M.base;
      ctx.beginPath();
      ctx.moveTo(-76, -36); ctx.lineTo(-30, -74); ctx.lineTo(30, -74); ctx.lineTo(76, -36);
      ctx.lineTo(98, 28); ctx.lineTo(52, 76); ctx.lineTo(-52, 76); ctx.lineTo(-98, 28); ctx.closePath(); ctx.fill();
      ctx.fillStyle = h ? lighten(M.lite, 0.24) : M.lite;
      ctx.beginPath();
      ctx.moveTo(-60, -28); ctx.lineTo(-24, -60); ctx.lineTo(24, -60); ctx.lineTo(60, -28);
      ctx.lineTo(76, 22); ctx.lineTo(42, 60); ctx.lineTo(-42, 60); ctx.lineTo(-76, 22); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#1a1428';
      ctx.fillRect(-36, -52, 72, 36);
      ctx.fillStyle = ph2 ? '#ff2050' : '#c080ff';
      ctx.fillRect(-28, -46, 22, 12); ctx.fillRect(6, -46, 22, 12);
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(0, 12, 20 + Math.sin(GS.frame * 0.15) * 3, 0, TAU); ctx.fill();
      ctx.fillStyle = ph2 ? '#ff3050' : '#8040ff';
      ctx.beginPath(); ctx.arc(0, 12, 12 + Math.sin(GS.frame * 0.2) * 2, 0, TAU); ctx.fill();
      break;
    }
  }
}
function drawBossPart(b, p){
  const M = BOSS_MAT[b.def.shape] || BOSS_MAT.ship;
  const h = p.hitFlash > 0;
  const base = h ? lighten(M.base, 0.24) : M.base;
  const dark = h ? lighten(M.dark, 0.24) : M.dark;
  const lite = h ? lighten(M.lite, 0.24) : M.lite;
  const acc = b.phase >= 2 ? '#ff6070' : M.acc;
  if (p.dead){
    ctx.globalAlpha = 0.9;
    const R = Math.round(p.r * 0.74);
    // 像素残骸
    px(ctx, -R, -R + 4, R * 2, R * 2 - 8, '#0b0b12');
    px(ctx, -R + 4, -R, R * 2 - 8, R * 2, '#0b0b12');
    px(ctx, -R + 3, -R + 6, R * 2 - 6, R * 2 - 12, '#241f1c');
    px(ctx, -R + 6, -R + 3, R * 2 - 12, R * 2 - 6, '#241f1c');
    const em = 0.35 + Math.sin(GS.frame * 0.3) * 0.2;
    ctx.globalAlpha = em;
    px(ctx, -R * 0.4, -R * 0.4, R * 0.8, R * 0.8, '#ff7828');
    ctx.globalAlpha = 0.9;
    px(ctx, -R, -R, 5, 5, '#5a5550');
    px(ctx, R - 5, R - 5, 5, 5, '#5a5550');
    ctx.globalAlpha = 1;
    return;
  }
  switch (p.kind){
    case 'gun': {
      const w = Math.round(p.w), hh = Math.round(p.h);
      const c0 = '#0b0b12';
      px(ctx, -w * 0.5 - 1, -hh * 0.44 - 1, w + 2, hh * 0.94 + 2, c0);
      px(ctx, -w * 0.42, -hh * 0.44, w * 0.84, hh * 0.9, dark);
      px(ctx, -w * 0.38, -hh * 0.36, w * 0.76, hh * 0.72, base);
      px(ctx, -w * 0.3, -hh * 0.34, w * 0.6, hh * 0.18, lite);
      px(ctx, -w * 0.44, -hh * 0.4, 3, 3, lite);
      px(ctx, w * 0.44 - 3, -hh * 0.4, 3, 3, lite);
      const a = aimAngle(p.x, p.y, 0);
      ctx.save(); ctx.rotate(a);
      px(ctx, 0, -6, p.r + 20, 12, c0);
      px(ctx, 0, -4, p.r + 18, 8, dark);
      px(ctx, 0, -1.5, p.r + 16, 3, lite);
      px(ctx, p.r + 14, -6, 5, 12, '#1a1a20');
      ctx.restore();
      px(ctx, -4, -4, 8, 8, c0);
      px(ctx, -3, -3, 6, 6, acc);
      px(ctx, -1, -1, 3, 3, '#ffffff');
      break;
    }
    case 'wing': {
      const w = Math.round(p.w), hh = Math.round(p.h);
      const c0 = '#0b0b12';
      px(ctx, -w * 0.5 - 1, -hh * 0.46 - 1, w * 0.92 + 1, hh * 0.96 + 2, c0);
      px(ctx, -w * 0.5, -hh * 0.46, w * 0.9, hh * 0.94, dark);
      px(ctx, -w * 0.42, -hh * 0.34, w * 0.8, hh * 0.72, base);
      px(ctx, -w * 0.4, -hh * 0.3, w * 0.72, 4, lite);
      px(ctx, -w * 0.26, hh * 0.16, 12, 20, c0);
      px(ctx, -w * 0.24, hh * 0.18, 8, 16, '#20242c');
      px(ctx, -w * 0.22, hh * 0.44, 6, 8, '#ffaa5a');
      px(ctx, w * 0.18, -4, 8, 8, c0);
      px(ctx, w * 0.2, -2, 4, 4, acc);
      break;
    }
    case 'arm': {
      const w = Math.round(p.w), hh = Math.round(p.h);
      const c0 = '#0b0b12';
      px(ctx, -w * 0.5 - 1, -hh * 0.5 - 1, w + 2, hh + 2, c0);
      px(ctx, -w * 0.5, -hh * 0.5, w, hh, dark);
      px(ctx, -w * 0.34, -hh * 0.4, w * 0.68, hh * 0.56, base);
      px(ctx, -w * 0.28, -hh * 0.36, w * 0.12, hh * 0.48, lite);
      px(ctx, -w * 0.3, -hh * 0.5, w * 0.6, w * 0.5, c0);
      px(ctx, -w * 0.26, -hh * 0.46, w * 0.52, w * 0.42, dark);
      px(ctx, -w * 0.18, -hh * 0.4, w * 0.36, w * 0.3, lite);
      px(ctx, -w * 0.42, hh * 0.34, w * 0.84, hh * 0.22, c0);
      px(ctx, -w * 0.4, hh * 0.36, w * 0.8, hh * 0.18, '#20262f');
      px(ctx, -5, hh * 0.4, 10, 10, acc);
      break;
    }
    case 'claw': {
      const w = Math.round(p.w), hh = Math.round(p.h);
      const c0 = '#0b0b12';
      // 钳臂(像素阶梯)
      for (let k = 0; k < 5; k++){
        const t = k / 4;
        const lx = -w * (0.3 + t * 0.25), ly = -hh * (0.06 + t * 0.3);
        px(ctx, lx - 5, ly - 5, 10, 10, c0);
        px(ctx, lx - 3, ly - 3, 6, 6, k % 2 ? base : dark);
        const rx = w * (0.3 + t * 0.25);
        px(ctx, rx - 5, ly - 5, 10, 10, c0);
        px(ctx, rx - 3, ly - 3, 6, 6, k % 2 ? base : dark);
      }
      // 钳体(像素八边形)
      px(ctx, -w * 0.42, -hh * 0.28, w * 0.84, hh * 0.56, c0);
      px(ctx, -w * 0.3, -hh * 0.4, w * 0.6, hh * 0.8, c0);
      px(ctx, -w * 0.4, -hh * 0.24, w * 0.8, hh * 0.48, base);
      px(ctx, -w * 0.26, -hh * 0.34, w * 0.52, hh * 0.68, base);
      px(ctx, -w * 0.28, -hh * 0.2, w * 0.4, hh * 0.3, lite);
      px(ctx, -4, -4, 8, 8, acc);
      break;
    }
    case 'eye': {
      const R = Math.round(p.r);
      const c0 = '#0b0b12';
      px(ctx, -R, -R, R * 2, R * 2, c0);
      px(ctx, -R + 2, -R + 2, R * 2 - 4, R * 2 - 4, dark);
      px(ctx, -R + 4, -R + 4, R * 2 - 8, R * 2 - 8, base);
      const pr = Math.round(R * 0.55 + Math.sin(GS.frame * 0.2) * 1.5);
      px(ctx, -pr, -pr, pr * 2, pr * 2, '#ff3050');
      px(ctx, -pr + 1, -pr + 1, pr, pr, '#ffffff');
      break;
    }
    default: {
      const R = Math.round(p.r);
      px(ctx, -R, -R, R * 2, R * 2, '#0b0b12');
      px(ctx, -R + 2, -R + 2, R * 2 - 4, R * 2 - 4, base);
      px(ctx, -R * 0.4, -R * 0.4, R * 0.8, R * 0.8, acc);
    }
  }
  // 命中闪光描边(像素框)
  if (h){
    const R = Math.round(p.r * 0.95);
    px(ctx, -R, -R - 2, R * 2, 2, 'rgba(255,255,255,0.7)');
    px(ctx, -R, R, R * 2, 2, 'rgba(255,255,255,0.7)');
    px(ctx, -R - 2, -R, 2, R * 2, 'rgba(255,255,255,0.7)');
    px(ctx, R, -R, 2, R * 2, 'rgba(255,255,255,0.7)');
  }
  // 受损血条(像素段)
  const frac = clamp(p.hp / p.maxHp, 0, 1);
  if (frac < 0.995){
    const bw = Math.round(Math.max(26, p.r * 1.7));
    const segs = 8;
    const filled = Math.ceil(frac * segs);
    const col = frac > 0.5 ? '#50d0ff' : (frac > 0.25 ? '#ffd24a' : '#ff6060');
    const y0 = Math.round(p.r + 6);
    px(ctx, -bw / 2 - 1, y0 - 1, bw + 2, 5, '#0b0b12');
    for (let i = 0; i < segs; i++){
      const sw = (bw - 2) / segs;
      if (i < filled) px(ctx, -bw / 2 + 1 + i * sw, y0, sw - 1, 3, col);
    }
  }
}
function drawBossCore(b, c){
  const h = c.hitFlash > 0;
  const frac = clamp(c.hp / c.maxHp, 0, 1);
  const pulse = 7 + Math.sin(GS.frame * 0.14) * 3;
  const weak = bossAliveParts().length === 0;
  const sx = c.shieldFx || 0;
  const MC = BOSS_MAT[b.def.shape] || BOSS_MAT.ship;
  const R = Math.round(c.r);
  const c0 = '#0b0b12';
  // 装甲环(部件未破时): 像素点阵环
  if (!weak){
    ctx.globalAlpha = 0.55;
    const rr = R + 14 + sx * 1.5;
    const col = sx > 0 ? '#ffffff' : MC.acc;
    for (let i = 0; i < 28; i++){
      const a = i / 28 * TAU;
      px(ctx, Math.cos(a) * rr - 2, Math.sin(a) * rr - 2, 4, 4, col);
    }
    // 八向装甲片
    ctx.globalAlpha = 0.75;
    for (let i = 0; i < 8; i++){
      const a = i / 8 * TAU + GS.frame * 0.004;
      const x0 = Math.cos(a), y0 = Math.sin(a);
      for (let k = 0; k < 4; k++){
        const t = R + 4 + k * 4;
        px(ctx, x0 * t - 2, y0 * t - 2, 4, 4, lighten(MC.acc, 0.35));
      }
    }
    ctx.globalAlpha = 1;
  } else {
    // 破甲后: 脉冲红环
    ctx.globalAlpha = 0.55 + Math.sin(GS.frame * 0.18) * 0.3;
    const rr = R + 15;
    for (let i = 0; i < 24; i++){
      const a = i / 24 * TAU + GS.frame * 0.02;
      px(ctx, Math.cos(a) * rr - 2, Math.sin(a) * rr - 2, 4, 4, '#ff4060');
    }
    ctx.globalAlpha = 1;
  }
  // 核心本体(像素八边形)
  px(ctx, -R, -R * 0.6, R * 2, R * 1.2, c0);
  px(ctx, -R * 0.6, -R, R * 1.2, R * 2, c0);
  px(ctx, -R + 2, -R * 0.5, R * 2 - 4, R, h ? lighten(MC.dark, 0.24) : (weak ? '#5a1c28' : MC.dark));
  px(ctx, -R * 0.5, -R + 2, R, R * 2 - 4, h ? lighten(MC.dark, 0.24) : (weak ? '#5a1c28' : MC.dark));
  // 脉冲核心
  const pr = Math.round(pulse + R * 0.42);
  const cc = weak ? '#ff2050' : '#ffb040';
  px(ctx, -pr, -pr * 0.7, pr * 2, pr * 1.4, cc);
  px(ctx, -pr * 0.7, -pr, pr * 1.4, pr * 2, cc);
  const wr = Math.round(pulse * 0.45 + 4);
  px(ctx, -wr, -wr, wr * 2, wr * 2, '#ffffff');
  // 破损裂纹(像素)
  if (frac < 0.6){
    for (let i = 0; i < 3; i++){
      const a = i * 2.1 + 0.4;
      for (let k = 1; k <= 4; k++){
        const t = R * (0.2 + k * 0.18);
        px(ctx, Math.cos(a + k * 0.1) * t - 2, Math.sin(a + k * 0.1) * t - 2, 4, 4, 'rgba(0,0,0,0.6)');
      }
    }
  }
}

// ---------- 道具 ----------
function drawItems(){
  for (const it of items){
    ctx.save(); ctx.translate(it.x, it.y);
    if (it.kind === ITEM.P || it.kind === ITEM.B){
      const bob = Math.sin(it.t * 0.2) * 1.5;
      ctx.translate(0, Math.round(bob));
      const col = it.kind === ITEM.P ? '#ff3a4a' : '#ff9e3d';
      const col2 = it.kind === ITEM.P ? '#7a1018' : '#7a4410';
      const c0 = '#0b0b12';
      // 硬黑轮廓 + 像素胶囊(彩京子弹形道具)
      px(ctx, -10, -12, 20, 24, c0);
      px(ctx, -12, -8, 24, 16, c0);
      px(ctx, -9, -11, 18, 22, col2);
      px(ctx, -11, -7, 22, 14, col2);
      px(ctx, -8, -9, 16, 18, col);
      px(ctx, -9, -6, 18, 12, col);
      // 高光
      px(ctx, -6, -8, 4, 14, '#ffffff');
      px(ctx, -5, -7, 2, 5, '#ffffff');
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 13px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(it.kind === ITEM.P ? 'P' : 'B', 1, 1);
      ctx.textBaseline = 'alphabetic';
    } else if (it.kind === ITEM.LIFE){
      const c0 = '#0b0b12';
      px(ctx, -10, -10, 20, 20, c0);
      px(ctx, -8, -8, 16, 16, '#ffd24a');
      px(ctx, -6, -6, 12, 12, '#fff3c0');
      px(ctx, -4, -4, 8, 8, '#7a5a10');
      ctx.fillStyle = '#ffe86a'; ctx.font = 'bold 13px monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('1', 0, 0);
      ctx.textBaseline = 'alphabetic';
    } else {
      // 金块: 亮/暗 交替, 像素块
      const bright = it.blink === 0;
      ctx.rotate(Math.round(Math.sin(it.t * 0.12) * 2) * 0.14);
      const w = 7, hh = 5;
      if (bright){
        ctx.globalAlpha = 0.5;
        px(ctx, -w * 1.8, -hh * 2.1, w * 3.6, hh * 4.2, '#ffe066');
        ctx.globalAlpha = 1;
      }
      px(ctx, -w - 1, -hh - 1, w * 2 + 2, hh * 2 + 2, '#0b0b12');
      px(ctx, -w, -hh, w * 2, hh * 2, bright ? '#ffe066' : '#9a8a4a');
      px(ctx, -w * 0.5, -hh * 0.6, w, hh * 1.2, bright ? '#c9a02a' : '#6a6034');
      px(ctx, -w, -hh, w * 2, 1, bright ? '#fffbe0' : '#b0a470');
    }
    ctx.restore();
  }
}

// ---------- 粒子 / 文字 ----------
function drawParticles(){
  for (const q of parts){
    const lf = 1 - q.t / q.life;
    if (q.ring){
      ctx.globalAlpha = lf * 0.9;
      ctx.strokeStyle = q.col; ctx.lineWidth = 2.5 * lf + 0.5;
      ctx.beginPath(); ctx.arc(q.x, q.y, q.r + q.t * (q.grow || 3), 0, TAU); ctx.stroke();
    } else if (q.kind === 'smoke'){
      ctx.globalAlpha = lf * 0.5;
      ctx.fillStyle = q.col;
      ctx.beginPath(); ctx.arc(q.x, q.y, q.r * (1 + q.t * 0.06), 0, TAU); ctx.fill();
    } else {
      ctx.globalAlpha = lf;
      ctx.fillStyle = q.col;
      ctx.beginPath(); ctx.arc(q.x, q.y, Math.max(0.4, q.r * lf), 0, TAU); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}
function drawTexts(){
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  for (const t of texts){
    const lf = 1 - t.t / t.life;
    ctx.globalAlpha = lf;
    ctx.font = 'bold ' + t.size + 'px monospace';
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillText(t.txt, t.x + 1.5, t.y + 1.5);
    ctx.fillStyle = t.col;
    ctx.fillText(t.txt, t.x, t.y);
  }
  ctx.globalAlpha = 1;
}

// ---------- 炸弹演出 ----------
function drawBombEffects(){
  if (!bombAct) return;
  const b = bombAct, P = b.P;
  ctx.save();
  switch (b.kind){
    case 'loopBoom': {
      const R = b.t * 4.6;
      ctx.globalAlpha = clamp(1 - b.t / b.life, 0, 1) * 0.8;
      ctx.strokeStyle = P.col; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.arc(b.cx, b.cy, R, 0, TAU); ctx.stroke();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(b.cx, b.cy, R * 0.94, 0, TAU); ctx.stroke();
      break;
    }
    case 'carpet': {
      ctx.globalAlpha = 0.85;
      for (let i = 0; i < 3; i++){
        const bx = W * (0.2 + i * 0.3) + Math.sin(b.t * 0.1 + i) * 40;
        const by = -20 + (b.t / 6) * 26;
        ctx.save(); ctx.translate(bx, by);
        ctx.fillStyle = '#3a3a48';
        ctx.beginPath(); ctx.ellipse(0, 0, 34, 12, 0, 0, TAU); ctx.fill();
        ctx.fillStyle = '#4c4c5e';
        ctx.fillRect(-40, -8, 80, 10);
        ctx.fillStyle = '#2a2a36';
        ctx.fillRect(-6, -20, 12, 40);
        ctx.fillStyle = 'rgba(255,170,90,0.85)';
        ctx.beginPath(); ctx.ellipse(-26, 10, 5, 8, 0, 0, TAU); ctx.fill();
        ctx.beginPath(); ctx.ellipse(26, 10, 5, 8, 0, 0, TAU); ctx.fill();
        ctx.restore();
      }
      break;
    }
    case 'laserBlast': {
      const w = 130 * Math.min(1, b.t / 20) * (b.t > 110 ? (150 - b.t) / 40 : 1);
      const p = player;
      if (p){
        const gg = ctx.createLinearGradient(p.x - w / 2, 0, p.x + w / 2, 0);
        gg.addColorStop(0, 'rgba(255,255,255,0)');
        gg.addColorStop(0.3, P.col);
        gg.addColorStop(0.5, '#fff');
        gg.addColorStop(0.7, P.col);
        gg.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = gg;
        ctx.fillRect(p.x - w / 2, 0, w, p.y);
      }
      break;
    }
    case 'thunder': {
      ctx.globalAlpha = 0.9;
      for (let i = 0; i < 5; i++){
        const x = ((i * 97 + b.t * 53) % W);
        const y = (b.t * 26 + i * 130) % (H * 0.8);
        ctx.strokeStyle = '#cfe8ff'; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        let yy = 0, xx = x;
        while (yy < y){
          yy += 22; xx += rand(-14, 14);
          ctx.lineTo(xx, yy);
        }
        ctx.stroke();
      }
      break;
    }
    case 'shadow': {
      const p = player;
      if (p){
        ctx.globalAlpha = 0.55;
        ctx.save(); ctx.translate(p.x, p.y); drawShipShape(ctx, P, 0, 1); ctx.restore();
        ctx.globalAlpha = 1;
      }
      break;
    }
    case 'kamikaze': {
      ctx.globalAlpha = 0.8;
      for (let i = 0; i < 4; i++){
        const t2 = (b.t * 3 + i * 40) % 160;
        const x = W * (0.15 + i * 0.23);
        const y = t2 * 2.2 - 40;
        if (y > -30 && y < H){
          ctx.save(); ctx.translate(x, y); ctx.rotate(0.4 + Math.sin(i) * 0.3);
          ctx.fillStyle = '#6a6a7a';
          ctx.beginPath(); ctx.moveTo(0, 14); ctx.lineTo(-9, -10); ctx.lineTo(9, -10); ctx.closePath(); ctx.fill();
          ctx.fillStyle = 'rgba(255,140,60,0.9)';
          ctx.beginPath(); ctx.arc(0, -6, 4, 0, TAU); ctx.fill();
          ctx.restore();
        }
      }
      break;
    }
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

// ---------- BOSS 警告 ----------
function drawBossWarn(){
  const a = GS.warnT > 130 ? (160 - GS.warnT) / 30 : (GS.warnT < 30 ? GS.warnT / 30 : 1);
  ctx.globalAlpha = clamp(a, 0, 1);
  ctx.fillStyle = 'rgba(120,0,0,0.32)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#ff2040';
  ctx.font = 'bold 34px monospace';
  ctx.textAlign = 'center';
  const yy = H / 2 - 30 + Math.sin(GS.frame * 0.3) * 4;
  ctx.fillText('W A R N I N G', W / 2, yy);
  ctx.font = 'bold 14px monospace';
  ctx.fillStyle = '#ffd0d0';
  ctx.fillText('大型敌机接近中', W / 2, yy + 28);

function drawBossBar(b){
  const x = 26, y = 42, w = W - 52, h = 8;
  const parts = b.parts.filter(function(p){ return !p.isCore; });
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(x - 2, y - 2, w + 4, h + 4);
  // 部件血量
  if (parts.length){
    const seg = w / parts.length;
    for (let i = 0; i < parts.length; i++){
      const p = parts[i];
      const f = p.dead ? 0 : clamp(p.hp / p.maxHp, 0, 1);
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fillRect(x + i * seg + 1, y, seg - 2, h);
      if (!p.dead){
        ctx.fillStyle = f > 0.5 ? '#50d0ff' : (f > 0.25 ? '#ffd24a' : '#ff6060');
        ctx.fillRect(x + i * seg + 1, y, (seg - 2) * f, h);
      } else {
        ctx.fillStyle = '#3a2020';
        ctx.fillRect(x + i * seg + 1, y, seg - 2, h);
      }
    }
  }
  // 核心
  const cf = clamp(b.core.hp / b.core.maxHp, 0, 1);
  const cy2 = y + h + 3;
  ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(x, cy2, w, 6);
  ctx.fillStyle = cf > 0.5 ? '#50ff80' : (cf > 0.25 ? '#ffd24a' : '#ff4060');
  ctx.fillRect(x, cy2, w * cf, 6);
  ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1;
  ctx.strokeRect(x - 0.5, cy2 - 0.5, w + 1, 7);
  // 装甲状态提示
  if (bossAliveParts().length > 0 && b.dying === 0){
    ctx.font = 'bold 9px monospace'; ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(150,215,255,0.95)';
    ctx.fillText('CORE ARMORED', x + w, cy2 + 14);
  } else if (b.dying === 0){
    ctx.font = 'bold 9px monospace'; ctx.textAlign = 'right';
    ctx.fillStyle = (GS.frame % 20 < 10) ? '#ff6080' : '#ffd0d8';
    ctx.fillText('CORE EXPOSED!', x + w, cy2 + 14);
  }
  ctx.font = 'bold 10px monospace'; ctx.textAlign = 'left';
  ctx.fillStyle = '#fff';
  ctx.fillText(b.name, x, y - 4);
  ctx.textAlign = 'right';
  ctx.fillStyle = b.timeLeft < 600 ? '#ff6060' : '#ffd24a';
  ctx.fillText('TIME ' + Math.ceil(Math.max(0, b.timeLeft) / 60), x + w, y - 4);
}

// 音名 -> 频率
const NOTE = { 'C': 0, 'C#': 1, 'D': 2, 'D#': 3, 'E': 4, 'F': 5, 'F#': 6, 'G': 7, 'G#': 8, 'A': 9, 'A#': 10, 'B': 11 };
function freq(name){
  // 例如 'A4' / 'C#5'
  const m = /^([A-G]#?)(-?\d)$/.exec(name);
  if (!m) return 440;
  const semi = NOTE[m[1]] + (parseInt(m[2], 10) + 1) * 12;
  return 440 * Math.pow(2, (semi - 69) / 12);
}

const MUS = {
  on: true, track: null, step: 0, nextT: 0, gain: null, leadGain: null,
  lastTrack: null, fade: 0
};
function musicInit(){
  if (!audio || MUS.gain) return;
  MUS.gain = audio.createGain(); MUS.gain.gain.value = 0.0; MUS.gain.connect(masterGain);
  MUS.leadGain = audio.createGain(); MUS.leadGain.gain.value = 0.9; MUS.leadGain.connect(MUS.gain);
  MUS.bassGain = audio.createGain(); MUS.bassGain.gain.value = 1.0; MUS.bassGain.connect(MUS.gain);
  MUS.percGain = audio.createGain(); MUS.percGain.gain.value = 0.8; MUS.percGain.connect(MUS.gain);
}
function musicPlay(name){
  if (!audio) return;
  musicInit();
  if (!MUS.gain) return;
  if (MUS.lastTrack === name && MUS.track) return;
  MUS.track = TRACKS[name] || null;
  MUS.lastTrack = name;
  MUS.step = 0;
  MUS.nextT = audio.currentTime + 0.06;
  MUS.target = MUS.track ? 0.16 : 0;
}
function musicStop(){ MUS.target = 0; MUS.lastTrack = null; }
function musicTick(){
  if (!audio || !MUS.gain) return;
  // 音量渐变
  const cur = MUS.gain.gain.value;
  const tgt = (muted || !MUS.on) ? 0 : (MUS.target || 0);
  if (Math.abs(cur - tgt) > 0.001) MUS.gain.gain.value = cur + (tgt - cur) * 0.06;
  if (!MUS.track || tgt <= 0.001) return;
  const tr = MUS.track;
  const spb = 60 / tr.bpm;              // 每拍秒数
  const stepDur = spb / 2;              // 8 分音符
  const now = audio.currentTime;
  let guard = 0;
  while (MUS.nextT < now + 0.18 && guard++ < 24){
    const i = MUS.step % tr.lead.length;
    const t = MUS.nextT;
    // 主旋律
    if (tr.lead[i]) note(tr.lead[i], t, stepDur * 1.7, 'square', 0.05, MUS.leadGain);
    // 低音
    if (tr.bass[i]) note(tr.bass[i], t, stepDur * 1.5, 'triangle', 0.13, MUS.bassGain);
    // 打击
    if (tr.hat[i]) perc(t, 0.03, 7000, 0.06);
    if (tr.kick[i]) perc(t, 0.1, 180, 0.16);
    MUS.step++;
    MUS.nextT += stepDur;
  }
}
function note(name, t0, dur, type, vol, dest){
  try {
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type;
    o.frequency.value = freq(name);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    g.gain.setValueAtTime(vol, t0 + dur * 0.6);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(dest || MUS.gain);
    o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (e) {}
}
function perc(t0, dur, cutoff, vol){
  try {
    const n = Math.max(1, (dur * audio.sampleRate) | 0);
    const buf = audio.createBuffer(1, n, audio.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.2);
    const src = audio.createBufferSource(); src.buffer = buf;
    const f = audio.createBiquadFilter();
    if (cutoff > 3000){ f.type = 'highpass'; f.frequency.value = cutoff; }
    else { f.type = 'lowpass'; f.frequency.value = cutoff; }
    const g = audio.createGain(); g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(MUS.percGain);
    src.start(t0);
  } catch (e) {}
}
// 按状态切换曲目
function musicForState(){
  if (!audio) return;
  switch (GS.state){
    case 'title': musicPlay('title'); break;
    case 'select': musicPlay('title'); break;
    case 'intro': musicPlay(GS.loopBanner ? 'boss' : 'stage'); break;
    case 'play': musicPlay(boss && !boss.enter ? 'boss' : 'stage'); break;
    case 'clearwait': musicPlay('clear'); break;
    case 'gameover': musicStop(); break;
    case 'ending': musicPlay('clear'); break;
    default: musicStop();
  }
}
// ============================================================
//  Part 10: 主循环 / 初始化 / 调试接口
// ============================================================

// ---------- 主循环 ----------
let lastT = 0, accT = 0, running = true;
function loop(t){
  if (!lastT) lastT = t;
  let dt = t - lastT;
  lastT = t;
  if (dt > 200) dt = 200;
  accT += dt;
  let steps = 0;
  const STEP = 1000 / FPS;
  while (accT >= STEP && steps < 5){
    updateGame();
    accT -= STEP;
    steps++;
    keyQueue.length = 0;   // 一帧内只消费一次按键, 避免同帧多次触发
  }
  if (steps === 0 && accT > STEP * 0.9) accT = 0;
  musicForState();
  musicTick();
  render();
  // 只有真正跑过 update 才丢弃按键, 否则该帧的输入会丢失
  if (steps > 0) keyQueue.length = 0;
  requestAnimationFrame(loop);
}

// ---------- 初始化 ----------
function init(){
  fitCanvas();
  bg = makeBackground('sea');
  requestAnimationFrame(loop);
}
if (document.readyState === 'complete' || document.readyState === 'interactive') setTimeout(init, 0);
else window.addEventListener('DOMContentLoaded', init);
