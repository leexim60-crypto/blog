<script>
(function(){
'use strict';
// ============================================================
//  四国战机 STRIKERS 1945 —— 彩京(Psikyo)致敬版
//  纯 HTML/JS/Canvas · 单文件 · 零外部资源
//  Part 01: 常量 / 数学 / 音频 / 输入
// ============================================================
const W = 480, H = 680;
const TAU = Math.PI * 2, PI = Math.PI, HPI = PI / 2;
const FPS = 60;

// ---------- 数学工具 ----------
function rand(a, b){ return a + Math.random() * (b - a); }
function irand(a, b){ return (a + Math.random() * (b - a)) | 0; }
function pick(arr){ return arr[(Math.random() * arr.length) | 0]; }
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t){ return a + (b - a) * t; }
function dist2(ax, ay, bx, by){ const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; }
function angDiff(a, b){ let d = a - b; while (d > PI) d -= TAU; while (d < -PI) d += TAU; return d; }
function approach(cur, target, step){ const d = target - cur; return Math.abs(d) <= step ? target : cur + Math.sign(d) * step; }
// 颜色变亮(用于受击闪白, 保留形体可读性)
function lighten(hex, t){
  const h = hex.replace('#', '');
  const n = parseInt(h.length === 3 ? h[0]+h[0]+h[1]+h[1]+h[2]+h[2] : h, 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  r = Math.round(r + (255 - r) * t); g = Math.round(g + (255 - g) * t); b = Math.round(b + (255 - b) * t);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------- Canvas ----------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });
const wrapEl = document.getElementById('wrap');
const VIEW = { scale: 1, rect: null };
function fitCanvas(){
  // 由 CSS 控制尺寸; 关闭插值以保持硬像素边缘(16bit 街机质感)
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const r = canvas.getBoundingClientRect();
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (canvas.width !== w || canvas.height !== h){ canvas.width = w; canvas.height = h; }
  ctx.setTransform(w / W, 0, 0, h / H, 0, 0);
  ctx.imageSmoothingEnabled = false;
  VIEW.scale = w / W;
  VIEW.rect = r;
}
window.addEventListener('resize', fitCanvas);
window.addEventListener('orientationchange', function(){ setTimeout(fitCanvas, 120); });

// ---------- 音频(全合成, 零资源) ----------
const AC = window.AudioContext || window.webkitAudioContext;
let audio = null, masterGain = null, muted = false;
function initAudio(){
  if (!AC || audio) return;
  try {
    audio = new AC();
    masterGain = audio.createGain();
    masterGain.gain.value = 0.75;
    masterGain.connect(audio.destination);
  } catch (e) { audio = null; }
}
function unlockAudio(){
  initAudio();
  if (audio) musicInit();
  if (audio && audio.state === 'suspended'){ try { audio.resume(); } catch (e) {} }
}
function sfx(freq, dur, type, vol, slide, delay){
  if (!audio || muted) return;
  try {
    const t0 = audio.currentTime + (delay || 0);
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol || 0.08), t0 + Math.min(0.012, dur * 0.3));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(masterGain);
    o.start(t0); o.stop(t0 + dur + 0.03);
  } catch (e) {}
}
function sfxNoise(dur, vol, fLow, delay){
  if (!audio || muted) return;
  try {
    const t0 = audio.currentTime + (delay || 0);
    const n = Math.max(1, (dur * audio.sampleRate) | 0);
    const buf = audio.createBuffer(1, n, audio.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = audio.createBufferSource(); src.buffer = buf;
    const f = audio.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = fLow || 900;
    const g = audio.createGain();
    g.gain.setValueAtTime(Math.max(0.0002, vol || 0.25), t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(masterGain);
    src.start(t0);
  } catch (e) {}
}
const S = {
  shot(){ sfx(1250, 0.028, 'square', 0.012, -700); },
  shotHeavy(){ sfx(520, 0.06, 'square', 0.02, -260); },
  chargeLoop(step){ sfx(600 + step * 26, 0.03, 'sine', 0.012); },
  chargeOk(){ [880, 1174, 1568].forEach(function(f, i){ sfx(f, 0.1, 'sine', 0.055, 0, i * 0.05); }); },
  superAtk(){ sfx(180, 0.55, 'sawtooth', 0.09, 620); sfxNoise(0.5, 0.14, 1400); },
  boom(){ sfxNoise(0.36, 0.14, 900); sfx(120, 0.26, 'triangle', 0.07, -70); },
  bigBoom(){ sfxNoise(1.1, 0.26, 420); sfx(58, 0.7, 'triangle', 0.13, -28); },
  medal(v){ const n = clamp(Math.log2(v / 100), 0, 7); sfx(880 * Math.pow(1.12, n), 0.06, 'sine', 0.05); sfx(1320 * Math.pow(1.12, n), 0.07, 'sine', 0.04, 0, 0.04); },
  medalDull(){ sfx(420, 0.05, 'triangle', 0.03); },
  powerup(){ [659, 880, 1174].forEach(function(f, i){ sfx(f, 0.09, 'square', 0.05, 0, i * 0.045); }); },
  bomb(){ sfx(44, 1.0, 'sawtooth', 0.14, -18); sfxNoise(1.0, 0.2, 520); },
  die(){ sfxNoise(0.75, 0.22, 900); sfx(260, 0.6, 'sawtooth', 0.1, -210); },
  extend(){ [523, 659, 784, 1047, 1319, 1568].forEach(function(f, i){ sfx(f, 0.16, 'square', 0.06, 0, i * 0.085); }); },
  hit(){ sfx(300, 0.022, 'triangle', 0.016, -90); },
  hitArmor(){ sfxNoise(0.05, 0.06, 2600); },
  select(){ sfx(1046, 0.05, 'square', 0.04); },
  decide(){ sfx(784, 0.09, 'square', 0.055); sfx(1174, 0.12, 'square', 0.05, 0, 0.07); },
  bossWarn(){ [0, 0.34, 0.68].forEach(function(d){ sfx(150, 0.3, 'sawtooth', 0.09, 90, d); }); },
  stageClear(){ [784, 988, 1175, 1568].forEach(function(f, i){ sfx(f, 0.2, 'square', 0.055, 0, i * 0.13); }); },
  gameover(){ [523, 440, 349, 262].forEach(function(f, i){ sfx(f, 0.35, 'triangle', 0.075, 0, i * 0.22); }); },
  grade(){ [1047, 1319, 1568, 2093].forEach(function(f, i){ sfx(f, 0.22, 'sine', 0.06, 0, i * 0.1); }); },
  bombReady(){ sfx(1568, 0.09, 'square', 0.05); }
};

// ---------- 输入 ----------
const keys = {};
const keyQueue = [];
const PREVENT = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','KeyZ','KeyX','KeyP','KeyR','KeyH','Enter','ShiftLeft','ShiftRight'];
window.addEventListener('keydown', function(e){
  if (PREVENT.indexOf(e.code) >= 0) e.preventDefault();
  if (e.repeat) return;
  if (!keys[e.code]) keyQueue.push(e.code);
  keys[e.code] = true;
  unlockAudio();
});
window.addEventListener('keyup', function(e){ keys[e.code] = false; });
window.addEventListener('blur', function(){ for (const k in keys) keys[k] = false; touch.active = false; touch.tx = null; });

// 触屏: 拖动移动(带手指偏移) + 长按蓄力 + 双指炸弹
// 菜单类界面额外提供「点按」: 一次按下→抬起即触发一次动作(移动端没有方向键)
const touch = { active: false, tx: null, ty: null, id: null, twoFingerT: 0,
                sx: 0, sy: 0, st: 0, moved: false };

// ---------- 可点区域(触屏菜单) ----------
// 渲染时登记逻辑坐标矩形, 触摸时命中即入队对应按键。
// 每帧绘制前清空, 因此屏幕上看不到的项永远不会被误点。
let TAPZONES = [];
function clearTapZones(){ TAPZONES.length = 0; }
function tapZone(x, y, w, h, act, isBtn){
  const z = { x: x, y: y, w: w, h: h, act: act, btn: !!isBtn };
  TAPZONES.push(z);
  return z;
}
function tapZoneHit(x, y){
  // 从后往前: 后绘制的(视觉上层的)优先
  for (let i = TAPZONES.length - 1; i >= 0; i--){
    const z = TAPZONES[i];
    if (x >= z.x && x <= z.x + z.w && y >= z.y && y <= z.y + z.h) return z;
  }
  return null;
}
function canvasXY(cx, cy){
  const r = VIEW.rect || canvas.getBoundingClientRect();
  return { x: (cx - r.left) * (W / r.width), y: (cy - r.top) * (H / r.height) };
}
function touchStart(e){
  e.preventDefault(); unlockAudio();
  TOUCH_UI = true;   // 真实触摸后才切换为触屏提示
  if (e.touches.length >= 2 && !touch.twoFingerT){
    touch.twoFingerT = 1;
    keyQueue.push('KeyX');
    setTimeout(function(){ touch.twoFingerT = 0; }, 400);
    return;
  }
  const t = e.touches[0]; const p = canvasXY(t.clientX, t.clientY);
  touch.sx = p.x; touch.sy = p.y; touch.st = performance.now(); touch.moved = false;
  touch.tx = p.x; touch.ty = p.y - 46;   // 手指偏移, 不遮挡自机
  // 按钮类区域: 不接管拖动, 避免按暂停键时自机被拉过去
  const z = tapZoneHit(p.x, p.y);
  if (z && z.btn){ touch.active = false; return; }
  touch.active = true; touch.id = t.identifier;
  keys['KeyZ'] = true;
  // 菜单类界面不在此处确认, 交由可点区域判定(否则「选难度/选机」会被一次触摸直接跳过)
}
function touchMove(e){
  e.preventDefault();
  for (let i = 0; i < e.touches.length; i++){
    const t = e.touches[i];
    if (t.identifier === touch.id || touch.id === null){
      const p = canvasXY(t.clientX, t.clientY);
      touch.tx = p.x; touch.ty = p.y - 46;
      // 位移超过阈值即视为「拖动」而非「点按」
      if (Math.abs(p.x - touch.sx) > 10 || Math.abs(p.y - touch.sy) > 10) touch.moved = true;
      break;
    }
  }
}
function touchEnd(e){
  e.preventDefault();
  if (e.touches.length === 0){
    // 未拖动 + 短按 → 判定为点按, 命中可点区域则触发
    if (!touch.moved && performance.now() - touch.st < 600){
      const z = tapZoneHit(touch.tx, touch.ty + 46);
      if (z){
        if (typeof z.act === 'function') z.act();                     // 直接动作(如选中某项)
        else if (keyQueue.indexOf(z.act) < 0) keyQueue.push(z.act);   // 等价按键(交由 update 处理)
      }
    }
    touch.active = false; touch.tx = null; keys['KeyZ'] = false;
  }
}
canvas.addEventListener('touchstart', touchStart, { passive: false });
canvas.addEventListener('touchmove', touchMove, { passive: false });
canvas.addEventListener('touchend', touchEnd, { passive: false });
canvas.addEventListener('touchcancel', touchEnd, { passive: false });
canvas.addEventListener('mousedown', function(e){ unlockAudio(); });
canvas.addEventListener('contextmenu', function(e){ e.preventDefault(); });

// 按键语义
function held(...codes){ for (const c of codes) if (keys[c]) return true; return false; }
function tapped(...codes){ for (const c of codes) if (keyQueue.indexOf(c) >= 0) return true; return false; }
function fireHeld(){ return held('KeyZ', 'Space'); }
function focusHeld(){ return held('ShiftLeft', 'ShiftRight'); }

// ---------- 按键提示 (画面上直接标出对应按键) ----------
// 注意: Windows 触屏本 maxTouchPoints 也 > 0, 不能用来判定输入方式。
// 默认显示键盘按键; 一旦真的收到触摸事件才切到触屏提示。
let TOUCH_UI = false;
if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) TOUCH_UI = true;
const KEY_LABEL = {
  KeyZ: 'Z', KeyX: 'X', KeyP: 'P', KeyM: 'M', KeyR: 'R', KeyH: 'H',
  Enter: 'ENTER', Space: 'SPACE', Escape: 'ESC',
  ShiftLeft: 'SHIFT', ShiftRight: 'SHIFT',
  ArrowLeft: '←', ArrowRight: '→', ArrowUp: '↑', ArrowDown: '↓',
  KeyA: 'A', KeyD: 'D', KeyW: 'W', KeyS: 'S'
};
// 未登记的写法(如 '←→↑↓' / 'R / ENTER')原样显示
function keyLabel(code){ return KEY_LABEL[code] || code; }
// 触屏下把键盘按键名换成对应的触摸操作(仅用于“操作提示”类文案)
const TOUCH_LABEL = {
  KeyZ: '长按', KeyX: '双指', KeyP: '轻触', KeyR: '轻触',
  Enter: '轻触', Space: '轻触', Escape: '轻触', KeyH: '轻触'
};
function opLabel(code){ return (TOUCH_UI && TOUCH_LABEL[code]) ? TOUCH_LABEL[code] : keyLabel(code); }

// 画一个按键胶囊, 返回其宽度(供同行继续排版)
function keyCap(x, y, label, opt){
  opt = opt || {};
  const h = opt.h || 15, fs = opt.fs || 10;
  const col = opt.col || '#ffd24a';
  ctx.font = 'bold ' + fs + 'px monospace';
  const w = Math.max(opt.minW || 0, ctx.measureText(label).width + 10);
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = col; ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = col;
  ctx.fillText(label, x + w / 2, y + h / 2 + 0.5);
  ctx.textBaseline = 'alphabetic';
  return w;
}

// 一行 "[按键] 功能": items = [['KeyZ','射击'], ...]; 以 cx 居中, 返回总宽
function keyHintRow(cx, y, items, opt){
  opt = opt || {};
  const fs = opt.fs || 10, h = opt.h || 15;
  const gap = opt.gap === undefined ? 12 : opt.gap;
  const txtCol = opt.txtCol || '#cde';
  const lab = opt.labelFn || keyLabel;   // 可换成触屏操作名
  // 先测量
  let total = 0;
  for (let i = 0; i < items.length; i++){
    ctx.font = 'bold ' + fs + 'px monospace';
    const kw = Math.max(opt.minW || 0, ctx.measureText(lab(items[i][0])).width + 10);
    ctx.font = fs + 'px monospace';
    items[i]._kw = kw;
    items[i]._tw = ctx.measureText(items[i][1]).width;
    total += kw + 4 + items[i]._tw + (i < items.length - 1 ? gap : 0);
  }
  let x = (opt.x === undefined) ? (cx - total / 2) : opt.x;
  for (let i = 0; i < items.length; i++){
    const it = items[i];
    keyCap(x, y, lab(it[0]), { col: opt.col, fs: fs, h: h, minW: opt.minW });
    x += it._kw + 4;
    ctx.font = fs + 'px monospace';
    ctx.textAlign = 'left'; ctx.fillStyle = txtCol;
    ctx.fillText(it[1], x, y + h - 4);
    x += it._tw + gap;
  }
  return total;
}
// ============================================================
//  Part 02: 数据表 —— 战机 / 关卡 / 敌机 / BOSS
//  依据原作《Strikers 1945》(Psikyo 1995) 设定:

// ============================================================

// ---------- 玩家机体 ----------
// opt: 子机弹种   charge: 蓄力编队   bomb: 智能炸弹

function makeStageOrder(){

  const eu = EUROPE_STAGES.slice();

  return eu.concat(SPACE_STAGES);
}

];

function spdScale(){ return 1 + stageDifficulty() * 0.035; }

function spawnEnemy(type, x, y, extra){
  const d = ED[type];
  const e = {
    type: type, x: x, y: y, t: 0,
    hp: d.hp * (d.mid ? 1 : hpScale()), r: d.r, score: d.score,
    ground: !!d.ground, staticUnit: !!d.static, mid: !!d.mid,
    dead: false, gone: false, hitFlash: 0, fireT: irand(0, 40),
    gold: d.gold || 0, vx: 0, vy: 0, ang: 0, spin: 0, state: 0,
    bx: x, by: y, amp: 0, w: 0, esc: true, armor: 0
  };
  if (extra) for (const k in extra) e[k] = extra[k];
  e.maxHp = e.hp;
  GS.stats.spawned++;
  enemies.push(e);
  return e;
}

// ---------- 敌弹 ----------
function eb(x, y, ang, spd, col, r, opt){
  const b = {
    x: x, y: y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
    r: r || 4.5, col: col || '#ff4a6a', t: 0, kind: 0, dead: false, spin: 0
  };
  if (opt) for (const k in opt) b[k] = opt[k];
  ebullets.push(b);
  return b;
}
function aimAngle(x, y, spread){
  const px = player && !player.dead ? player.x : W / 2;
  const py = player && !player.dead ? player.y : H - 100;
  return Math.atan2(py - y, px - x) + (spread || 0);
}
function fireAimed(x, y, spd, n, spread, col, r){
  const base = aimAngle(x, y, 0);
  for (let i = 0; i < n; i++){
    const a = base + (n > 1 ? (i / (n - 1) - 0.5) * spread : 0);
    eb(x, y, a, spd * fireScale(), col, r);
  }
}
function fireRing(x, y, n, spd, off, col, r){
  for (let i = 0; i < n; i++) eb(x, y, off + i / n * TAU, spd * fireScale(), col, r);
}
function fireSpiral(x, y, a, spd, col, r){
  eb(x, y, a, spd * fireScale(), col, r);
  eb(x, y, a + PI, spd * fireScale(), col, r);
}

// ---------- 敌机 AI ----------
function updateEnemies(){
  const alive = player && !player.dead;
  for (let i = 0; i < enemies.length; i++){
    const e = enemies[i];
    if (e.gone) continue;
    if (e.dead){ e.gone = true; continue; }
    e.t++;
    if (e.hitFlash > 0) e.hitFlash--;
    switch (e.type){
      case 'pop': aiPop(e, alive); break;
      case 'dive': aiDive(e, alive); break;
      case 'medium': aiMedium(e, alive); break;
      case 'heavy': aiHeavy(e, alive); break;
      case 'tank': aiTank(e, alive); break;
      case 'turret': aiTurret(e, alive); break;
      case 'building': aiBuilding(e); break;
      case 'ship': aiShip(e, alive); break;
      case 'midboss': aiMidboss(e, alive); break;
    }
    // 出界判定
    if (e.ground){
      if (e.y > H + 60) e.gone = true;
    } else if (e.y > H + 70 || e.x < -140 || e.x > W + 140){
      if (e.y > H + 70 && e.esc && !e.dead) GS.stats.esc++;
      e.gone = true;
    }
  }
  enemies = enemies.filter(function(e){ return !e.gone; });
}
function aiPop(e, alive){
  switch (e.mode){
    case 0: e.y += e.vy; break;
    case 1: e.y += e.vy; e.x = e.bx + Math.sin(e.t * e.w * 3 + e.phase) * e.amp; break;
    case 2: // 侧入弧线
      e.y += e.vy * 0.85;
      e.x += e.dir * 2.6;
      if (e.t % 40 === 0) e.dir *= 0.4;
      break;
    case 3: { // 定点停留后离开
      if (!e.arrived){ e.y += 2.4; if (e.y >= e.stopY) e.arrived = true; }
      else { if (e.t % 6 === 0) e.x += Math.sin(e.t * 0.2) * 1.6; if (e.t > e.waitT) e.y += 3.2; }
      break;
    }
    case 4: e.y += e.vy; e.x = e.bx + Math.sin(e.t * 0.06) * 60; break;
  }
  const rate = Math.round(Math.max(46, 86 - stageDifficulty() * 4) * rateMul());
  if (e.y > 30 && e.y < H - 240 && alive && e.t % rate === 20){
    if (e.mode === 3) fireAimed(e.x, e.y + 10, 3.3, 1, 0, '#ff6a8a');
    else fireAimed(e.x, e.y + 8, 3.1, 1, 0, '#ff6a8a');
  }
}
function aiDive(e, alive){
  if (e.delay > 0){ e.delay--; e.y += 0.8; return; }
  if (!e.dived){
    e.dived = true;
    const a = aimAngle(e.x, e.y, rand(-0.15, 0.15));
    const sp = 6.6 * spdScale();
    e.vx = Math.cos(a) * sp; e.vy = Math.sin(a) * sp;
    e.ang = a + HPI;
  }
  e.x += e.vx; e.y += e.vy;
  if (e.t % 34 === 0) smallExplosion(e.x, e.y - 8, '#ffaa66');
}
function aiMedium(e, alive){
  if (e.mode === 1){ e.y += e.vy; e.x = e.bx + Math.sin(e.t * e.w * 3) * e.amp; }
  else e.y += e.vy;
  if (!alive) return;
  const d = stageDifficulty();
  if (e.y > 20 && e.y < H - 220){
    if (e.t % Math.round(Math.max(60, 110 - d * 6) * rateMul()) === 40) fireAimed(e.x, e.y + 14, 3.6, 3, 0.5, '#ff6a8a');
    if (e.t % Math.round(Math.max(80, 150 - d * 8) * rateMul()) === 90) fireRing(e.x, e.y, 7 + Math.min(4, d), 2.4, e.t * 0.04, '#ffa04a');
  }
}
function aiHeavy(e, alive){
  if (e.frozen){ e.x = e.bx; e.y = e.by; return; }
  e.y += e.vy;
  if (e.t < 90) e.x = e.bx + Math.sin(e.t * 0.03) * 40;
  if (!alive || e.noFire) return;
  const d = stageDifficulty();
  if (e.y > 20 && e.y < H - 200){
    if (e.t % Math.round(Math.max(70, 120 - d * 6) * rateMul()) === 30) fireAimed(e.x, e.y + 20, 3.4, 5, 0.7, '#ff4a6a');
    if (e.t % Math.round(Math.max(50, 90 - d * 5) * rateMul()) === 10){ const a = e.t * 0.17; for (let i = 0; i < 3; i++) eb(e.x, e.y + 18, a + i * TAU / 3, 3.0, '#c080ff', 5); }
    if (d > 1 && e.t % Math.round(200 * rateMul()) === 150) fireRing(e.x, e.y, 14 + Math.min(8, d * 2), 2.3, rand(0, TAU), '#ff4a6a');
  }
}
function aiTank(e, alive){
  e.y += e.vy;
  if (!alive) return;
  if (e.y > 10 && e.y < H - 200 && e.t % Math.round(Math.max(80, 130 - stageDifficulty() * 6) * rateMul()) === 50)
    fireAimed(e.x, e.y, 4.0, 1, 0, '#ffb03a', 5);
}
function aiTurret(e, alive){
  e.y += e.vy;
  e.aim = aimAngle(e.x, e.y, 0);
  if (!alive) return;
  if (e.y > 10 && e.y < H - 200 && e.t % Math.round(Math.max(90, 150 - stageDifficulty() * 6) * rateMul()) === 60)
    fireAimed(e.x, e.y, 2.9, 3, 0.85, '#ffb03a');
}
function aiBuilding(e){ e.y += e.vy; }
function aiShip(e, alive){
  e.y += e.vy;
  if (!alive) return;
  if (e.y > 20 && e.y < H - 180){
    const sv = Math.round(100 * rateMul());
    if (e.t % sv === 40) fireAimed(e.x, e.y + 8, 3.2, 3, 0.5, '#ff4a6a', 5);
    if (e.t % sv === 80){ eb(e.x - 22, e.y, HPI, 3.0, '#ffb03a', 4); eb(e.x + 22, e.y, HPI, 3.0, '#ffb03a', 4); }
  }
}
function aiMidboss(e, alive){
  if (!e.arrived){
    e.y += 1.3;
    if (e.y >= e.stopY){ e.y = e.stopY; e.arrived = true; }
    return;
  }
  e.x = W / 2 + Math.sin(e.t * 0.012) * 120;
  e.y = e.stopY + Math.sin(e.t * 0.02) * 14;
  if (!alive) return;
  const d = stageDifficulty();
  const ph = e.hp / e.maxHp < 0.5 ? 2 : 1;
  if (e.t % Math.round(Math.max(46, 78 - d * 4) * rateMul()) === 0) fireAimed(e.x, e.y + 26, 3.6, ph === 2 ? 5 : 3, 0.7, '#ff4a6a');
  if (e.t % Math.round(Math.max(90, 150 - d * 8) * rateMul()) === 60) fireRing(e.x, e.y, 10 + Math.min(8, d * 2), 2.3, e.t * 0.05, '#c080ff', 4.5);
  if (ph === 2 && e.t % Math.round(12 * rateMul()) === 0){ eb(e.x - 40, e.y + 20, e.t * 0.21, 3.0, '#ffa04a', 4.5); eb(e.x + 40, e.y + 20, -e.t * 0.21, 3.0, '#ffa04a', 4.5); }
}

// ---------- 伤害 / 击破 ----------
function damageEnemy(e, dmg, opts){
  if (e.dead || e.gone) return;
  if (e.armor && !(opts && opts.pierce)) dmg *= 0.35;
  e.hp -= dmg;
  e.hitFlash = 2;
  if (e.hp <= 0) killEnemy(e);
}
function killEnemy(e, silent){
  if (e.dead) return;
  e.dead = true; e.gone = true;
  GS.stats.kills++;
  addScore(e.score);
  const sc = e.r / 12;
  explosion(e.x, e.y, clamp(sc, 0.9, 4));
  if (!silent) (e.r > 24 ? S.bigBoom : S.boom)();
  if (e.gold){
    const n = e.gold;
    for (let i = 0; i < n; i++) dropItem(e.x + rand(-16, 16), e.y + rand(-10, 10), ITEM.GOLD);
  }
  if (e.type === 'medium' || e.type === 'heavy'){
    if (Math.random() < 0.55) dropItem(e.x, e.y, ITEM.P);
    else if (Math.random() < 0.25) dropItem(e.x, e.y, ITEM.B);
  }
  if (e.type === 'midboss'){
    for (let i = 0; i < 4; i++) dropItem(e.x + rand(-40, 40), e.y + rand(-20, 20), ITEM.GOLD);
    dropItem(e.x, e.y, ITEM.P); dropItem(e.x + 26, e.y, ITEM.B);
    for (const b of ebullets) dropItem(b.x, b.y, ITEM.GOLD, { vx: rand(-1, 1), vy: rand(-1, 1) });
    ebullets = [];
    GS.shake = 18; GS.flash = 10; GS.flashCol = '#fff';
  }
}

// ---------- 爆炸 ----------
function explosion(x, y, scale){
  const n = Math.min(46, Math.round(9 + scale * 7));
  for (let i = 0; i < n; i++){
    const a = rand(0, TAU), s = rand(0.5, 3.6) * scale;
    parts.push({
      x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: irand(18, 46),
      col: pick(['#ffdd55', '#ff8833', '#ff4422', '#ffffaa', '#ffffff']),
      r: rand(1.6, 5) * clamp(scale * 0.6, 0.7, 2.2), kind: 'spark'
    });
  }
  parts.push({ x: x, y: y, t: 0, life: 20, ring: 1, col: '#fff', r: 4, grow: 3.2 * scale, kind: 'ring' });
  parts.push({ x: x, y: y, t: 0, life: 26, ring: 1, col: '#ffaa44', r: 2, grow: 1.7 * scale, kind: 'ring' });
}
function smallExplosion(x, y, col){
  for (let i = 0; i < 4; i++){
    const a = rand(0, TAU), s = rand(0.4, 1.7);
    parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: irand(7, 16), col: col || '#ffd080', r: rand(1.2, 2.6), kind: 'spark' });
  }
}
function smoke(x, y, col){
  parts.push({ x: x, y: y, vx: rand(-0.4, 0.4), vy: rand(-1.4, -0.4), t: 0, life: irand(16, 30), col: col || 'rgba(120,120,130,0.5)', r: rand(2, 5), kind: 'smoke' });
}
// ============================================================
//  Part 05: 自机 —— 移动 / 射击 / 子机 / 蓄力攻击 / 炸弹 / 被弹
// ============================================================

let bombAct = null;      // 当前炸弹演出
let bombInvul = 0;       // 炸弹无敌帧

// ---------- 移动 ----------
function updatePlayer(){
  const p = player;
  if (!p) return;
  if (p.dead){
    p.deadT++;
    if (p.deadT === 96){
      if (GS.lives <= 0){
        GS.state = 'gameover';
        GS.paused = false;
        S.gameover();
        finalizeGrade();
        ebullets = []; pbullets = []; items = []; boss = null; bombAct = null;
      } else {
        respawn();
      }
    }
    return;
  }
  if (p.invul > 0) p.invul--;
  if (bombInvul > 0) bombInvul--;
  // 擦弹连锁计时
  if (GS.grazeChainT > 0){
    GS.grazeChainT--;
    if (GS.grazeChainT === 0){
      if (GS.grazeChain > GS.grazeBest) GS.grazeBest = GS.grazeChain;
      GS.grazeChain = 0;
    }
  }

  const focus = focusHeld();
  const sp = p.P.speed * (focus ? 0.42 : 1);
  const px0 = p.x;
  if (touch.active && touch.tx !== null){
    p.x += clamp(touch.tx - p.x, -13, 13);
    p.y += clamp(touch.ty - p.y, -13, 13);
  } else {
    if (held('ArrowLeft', 'KeyA')) p.x -= sp;
    if (held('ArrowRight', 'KeyD')) p.x += sp;
    if (held('ArrowUp', 'KeyW')) p.y -= sp;
    if (held('ArrowDown', 'KeyS')) p.y += sp;
  }
  p.x = clamp(p.x, 14, W - 14);
  p.y = clamp(p.y, 26, H - 22);
  p.bank = lerp(p.bank, clamp((p.x - px0) * 0.08, -0.35, 0.35), 0.25);
  p.optPhase += 0.09;

  // 射击: 按住时通常射击持续, 同时蓄力(彩京式); 松手放必杀
  const firing = fireHeld() || touch.active;
  if (firing){
    p.holdT++;
    const rateMul = p.gauge > 90 ? 1.45 : 1.0;
    if (--p.fireT <= 0){ firePlayer(); p.fireT = Math.max(2, Math.round(p.P.rate * rateMul)); }
    if (p.gauge < 180){
      p.gauge = Math.min(180, p.gauge + (p.gauge > 130 ? 1.05 : 1.75));
      if (GS.frame % 7 === 0) S.chargeLoop(p.gauge / 180 * 12);
      if (p.gauge >= 180 && !p.maxed){ p.maxed = true; S.chargeOk(); }
    }
    p.holding = true;
  } else {
    if (p.holding && p.gauge >= 180) releaseCharge();
    p.holding = false; p.holdT = 0; p.gauge = 0; p.maxed = false;
  }
  if (tapped('KeyX')) useBomb();

  // 蓄力攻击推进
  if (p.chargeFx) updateChargeFx(p.chargeFx);

  // 引擎粒子
  if (GS.frame % 3 === 0){
    parts.push({ x: p.x + rand(-2, 2), y: p.y + 12, vx: rand(-0.3, 0.3), vy: rand(1.2, 2.4), t: 0, life: 12, col: 'rgba(255,190,120,0.75)', r: rand(1.2, 2.4), kind: 'spark' });
  }
}

// ---------- 通常射击 ----------
function playerBullet(x, y, vx, vy, dmg, o){
  const b = { x: x, y: y, vx: vx, vy: vy, dmg: dmg, r: 5, t: 0, dead: false, hom: 0, pierce: 0, kind: 'normal', col: '#ffe86a', life: 200 };
  if (o) for (const k in o) b[k] = o[k];
  pbullets.push(b);
  return b;
}
function firePlayer(){
  const p = player, P = p.P;
  const up = -P.bulletSpd;
  switch (P.shot){
    case 'twin':
      playerBullet(p.x - 9, p.y - 12, 0, up, P.dmg);
      playerBullet(p.x + 9, p.y - 12, 0, up, P.dmg);
      GS.stats.shots += 2;
      break;
    case 'quad':
      playerBullet(p.x - 11, p.y - 8, -1.0, up, P.dmg * 0.85);
      playerBullet(p.x + 11, p.y - 8, 1.0, up, P.dmg * 0.85);
      playerBullet(p.x - 4, p.y - 14, 0, up * 1.02, P.dmg * 0.85);
      playerBullet(p.x + 4, p.y - 14, 0, up * 1.02, P.dmg * 0.85);
      GS.stats.shots += 4;
      break;
  }
  // 子机
  const opts = playerOptPositions(p);
  GS.stats.shots += opts.length;
  for (let i = 0; i < opts.length; i++){
    const o = opts[i];
    switch (P.opt){
      case 'forward':
        playerBullet(o.x, o.y - 8, 0, up * 0.96, P.optDmg, { r: 4.5, col: P.col3 });
        break;
      case 'missile':
        playerBullet(o.x, o.y - 6, 0, up * 0.72, P.optDmg, { r: 6, hom: 1, col: P.col, kind: 'missile' });
        break;
      case 'aim': {
        let best = null, bd = 1e9;
        for (const e of enemies){ if (e.dead || e.gone) continue; const d = dist2(o.x, o.y, e.x, e.y); if (d < bd){ bd = d; best = e; } }
        if (best){
          const a = Math.atan2(best.y - o.y, best.x - o.x);
          playerBullet(o.x, o.y - 4, Math.cos(a) * 13, Math.sin(a) * 13, P.optDmg, { r: 4.5, col: P.col3, kind: 'aimshot' });
        } else playerBullet(o.x, o.y - 4, 0, up, P.optDmg, { r: 4.5, col: P.col3 });
        break;
      }
      case 'lob':
        playerBullet(o.x, o.y, rand(-1.2, 1.2), up * 0.66, P.optDmg, { r: 6, hom: 1, col: P.col, kind: 'grenade' });
        break;
    }
  }
  if (P.shot === 'quad') S.shot(); else S.shot();
}

// ---------- 蓄力攻击 ----------
function releaseCharge(){
  const p = player, P = p.P;
  if (p.gauge < 180){ p.gauge = 0; return; }
  p.gauge = 0; p.maxed = false;
  GS.stats.chargeUsed++;
  S.superAtk();
  GS.shake = Math.max(GS.shake, 12);
  GS.flash = 7; GS.flashCol = P.col;
  p.chargeFx = { kind: P.charge, t: 0, life: 0, x: p.x, y: p.y, col: P.col, P: P, shots: 0, ang: 0 };
  switch (P.charge){
    case 'wall':      p.chargeFx.life = 110; p.chargeFx.fx = p.x; p.chargeFx.fy = p.y - 60; break;
    case 'drill':     p.chargeFx.life = 110; break;
    case 'wallDiag':  p.chargeFx.life = 110; break;
    case 'drillSpin': p.chargeFx.life = 120; break;
    case 'homing':    p.chargeFx.life = 100; break;
    case 'sideLine':  p.chargeFx.life = 100; break;
  }
}
function updateChargeFx(fx){
  const p = player;
  fx.t++;
  switch (fx.kind){
    // P-38: 子机在正前方结成不动的壁垒, 持续发射纵向弹幕
    case 'wall': {
      const cx = fx.fx, cy = fx.fy;
      if (fx.t % 6 === 0){
        for (let i = 0; i < 5; i++){
          playerBullet(cx - 40 + i * 20, cy, 0, -16, 9, { r: 5.5, col: fx.P.col3, pierce: 1, life: 80 });
        }
      }
      if (fx.t % 3 === 0) for (let i = 0; i < 2; i++) smallExplosion(cx + rand(-44, 44), cy + rand(-8, 8), fx.col);
      break;
    }
    // P-51: 子机在身前旋转绞碎(消弹)
    case 'drill': {
      fx.ang += 0.62;
      const R = 30 + Math.sin(fx.t * 0.3) * 6;
      const cx = p.x, cy = p.y - 34;
      if (fx.t % 3 === 0){
        for (let i = 0; i < 3; i++){
          const a = fx.ang + i * TAU / 3;
          playerBullet(cx + Math.cos(a) * R, cy + Math.sin(a) * R, Math.cos(a) * 5, Math.sin(a) * 5 - 9, 9, { r: 6, pierce: 1, col: fx.P.col3, life: 40 });
        }
      }
      // 消弹
      for (const b of ebullets){
        if (!b.dead && dist2(b.x, b.y, cx, cy) < 46 * 46){ b.dead = true; smallExplosion(b.x, b.y, '#fff'); addScore(10); }
      }
      if (fx.t % 2 === 0) smallExplosion(cx + rand(-26, 26), cy + rand(-26, 26), fx.col);
      break;
    }
    // 喷火: 子机斜向弹壁(跟随自机)
    case 'wallDiag': {
      const cx = p.x, cy = p.y - 40;
      if (fx.t % 5 === 0){
        for (let i = 0; i < 5; i++){
          playerBullet(cx - 34 + i * 17, cy, -3.6, -14, 8, { r: 5.5, col: fx.P.col3, pierce: 1, life: 80 });
          playerBullet(cx + 34 - i * 17, cy, 3.6, -14, 8, { r: 5.5, col: fx.P.col3, pierce: 1, life: 80 });
        }
      }
      break;
    }
    // Bf109: 子机绕自机旋转形成弹钻
    case 'drillSpin': {
      fx.ang += 0.30;
      const R = 46;
      for (let k = 0; k < 2; k++){
        const a = fx.ang + k * PI;
        playerBullet(p.x + Math.cos(a) * R, p.y + Math.sin(a) * R, Math.cos(a) * 6, Math.sin(a) * 6, 12, { r: 6, pierce: 1, col: fx.P.col3, life: 26 });
      }
      if (fx.t % 2 === 0) smallExplosion(p.x + Math.cos(fx.ang) * R, p.y + Math.sin(fx.ang) * R, fx.col);
      break;
    }
    // 零式: 追踪榴弹
    case 'homing': {
      if (fx.t % 8 === 0){
        for (let i = 0; i < 3; i++){
          playerBullet(p.x + rand(-24, 24), p.y - 8, rand(-3, 3), -rand(4, 7), 26, { r: 7, hom: 2, col: fx.col, kind: 'grenade', life: 130, pierce: 0 });
        }
      }
      break;
    }
    // 震电: 左右横扫弹列
    case 'sideLine': {
      if (fx.t % 6 === 0){
        const yy = p.y - 30 - (fx.shots % 6) * 24;
        for (let i = 0; i < 14; i++){
          playerBullet(-10 - i * 26, yy, 20, 0, 7.5, { r: 5, col: fx.P.col3, pierce: 1, life: 60 });
          playerBullet(W + 10 + i * 26, yy, -20, 0, 7.5, { r: 5, col: fx.P.col3, pierce: 1, life: 60 });
        }
        fx.shots++;
      }
      break;
    }
  }
  if (fx.t >= fx.life) player.chargeFx = null;
}

// ---------- 智能炸弹 ----------
function useBomb(){
  const p = player;
  if (!p || p.dead) return;
  if (GS.bombs <= 0){ S.hit(); addText(p.x, p.y - 40, '炸弹不足', '#ff8080', 13, 40); return; }
  if (bombAct) return;
  GS.bombs--;
  GS.stats.bombsUsed++;
  bombInvul = 150;
  S.bomb();
  GS.shake = 26; GS.flash = 14; GS.flashCol = '#fff';
  const P = p.P;
  bombAct = { kind: P.bomb, t: 0, life: 150, col: P.col, P: P, hits: 0, dmgDone: 0 };
  // 立刻消弹 -> 金块
  convertBullets();
  switch (P.bomb){
    case 'loopBoom':   bombAct.life = 140; break;
    case 'carpet':     bombAct.life = 190; bombAct.dropT = 0; break;
    case 'laserBlast': bombAct.life = 150; break;
    case 'kamikaze':   bombAct.life = 170; break;
    case 'thunder':    bombAct.life = 130; break;
    case 'shadow':     bombAct.life = 160; bombAct.sx = p.x; break;
  }
}
function convertBullets(){
  for (const b of ebullets){
    if (b.dead) continue;
    b.dead = true;
    if (Math.random() < 0.55) dropItem(b.x, b.y, ITEM.GOLD, { vx: rand(-1.2, 1.2), vy: rand(-1.6, -0.2) });
  }
  ebullets = ebullets.filter(function(b){ return !b.dead; });
}
function updateBomb(){
  if (!bombAct) return;
  const b = bombAct, p = player;
  b.t++;
  const P = b.P;
  switch (b.kind){
    // P-38: 环形爆击
    case 'loopBoom': {
      if (b.t === 1){ b.cx = p.x; b.cy = p.y - 60; }
      const R = b.t * 4.6;
      if (b.t % 5 === 0){
        for (const e of enemies){ if (!e.dead && dist2(e.x, e.y, b.cx, b.cy) < R * R) damageEnemy(e, 60); }
      }
      if (b.t === 40){ explosion(b.cx, b.cy, 6); GS.shake = 30; }
      break;
    }
    // P-51: 三架大型轰炸机地毯轰炸
    case 'carpet': {
      if (b.t <= 120 && b.t % 6 === 0){
        for (let i = 0; i < 3; i++){
          const bx = W * (0.2 + i * 0.3) + Math.sin(b.t * 0.1 + i) * 40;
          const by = -20 + (b.t / 6) * 26;
          explosion(bx, by + 30, 1.6);
        }
        GS.shake = Math.max(GS.shake, 8);
      }
      if (b.t % 4 === 0){
        for (let i = 0; i < 3; i++){
          const bx = W * (0.2 + i * 0.3) + Math.sin(b.t * 0.1 + i) * 40;
          const by = -20 + (b.t / 6) * 26;
          for (const e of enemies){ if (!e.dead && dist2(e.x, e.y, bx, by) < 70 * 70) damageEnemy(e, 22); }
        }
      }
      break;
    }
    // 喷火: 前置光爆(自机减速)
    case 'laserBlast': {
      const w = 130 * Math.min(1, b.t / 20) * (b.t > 110 ? (150 - b.t) / 40 : 1);
      if (b.t % 3 === 0){
        for (const e of enemies){
          if (!e.dead && e.y < p.y && Math.abs(e.x - p.x) < w / 2 + e.r) damageEnemy(e, 26);
        }
      }
      if (b.t % 3 === 0) smallExplosion(p.x + rand(-w / 2, w / 2), rand(0, p.y), P.col);
      break;
    }
    // Bf109: 特攻机群
    case 'kamikaze': {
      if (b.t % 10 === 0 && b.t < 110){
        for (let i = 0; i < 2; i++){
          const tx = rand(30, W - 30), ty = rand(60, H * 0.5);
          b.hits++;
          parts.push({ x: tx, y: -20, vx: 0, vy: 0, t: 0, life: 1, kind: 'noop' });
          b.lastTarget = { x: tx, y: ty };
          for (const e of enemies){ if (!e.dead && dist2(e.x, e.y, tx, ty) < 80 * 80) damageEnemy(e, 34); }
          explosion(tx, ty, 2.2);
        }
      }
      break;
    }
    // 零式: 神雷风暴(全屏落雷)
    case 'thunder': {
      if (b.t % 4 === 0 && b.t < 110){
        const tx = rand(20, W - 20), ty = rand(40, H * 0.7);
        b.lastBolt = { x: tx, y: ty };
        for (const e of enemies){ if (!e.dead && dist2(e.x, e.y, tx, ty) < 46 * 46) damageEnemy(e, 30); }
        explosion(tx, ty, 1.4);
        S.hitArmor();
      }
      break;
    }
    // 震电: 残影斩
    case 'shadow': {
      const sy = p.y;
      b.sy = sy;
      if (b.t % 2 === 0){
        const sx = (b.t / 2) * 14 - 40;
        b.sx = sx;
        for (const e of enemies){ if (!e.dead && Math.abs(e.y - sy) < 70 && Math.abs(e.x - sx) < 50) damageEnemy(e, 40); }
        smallExplosion(sx, sy + rand(-30, 30), P.col);
      }
      break;
    }
  }
  // 全局弱化: 炸弹期间持续小伤害
  if (b.t % 10 === 0) for (const e of enemies){ if (!e.dead) damageEnemy(e, 4); }
  if (b.t >= b.life){
    bombAct = null;
    if (ebullets.length) convertBullets();
  }
}

// ---------- 被弹 ----------
function playerHitByBullet(){
  const p = player;
  if (!p || p.dead || p.invul > 0 || bombInvul > 0) return;
  GS.lastHit = 'bullet';
  killPlayer();
}
function playerHitByEnemy(kind){
  const p = player;
  if (!p || p.dead || p.invul > 0 || bombInvul > 0) return;
  GS.lastHit = 'enemy:' + (kind || '?');
  if (GS.power > 0){ powerDown(); return; }   // 撞机掉威力而非致死(原作设定)
  killPlayer();
}
function powerDown(){
  const p = player;
  GS.power--;
  if (GS.power < 0) GS.power = 0;
  GS.stats.dmgTaken++;
  p.invul = Math.max(p.invul, 100);
  GS.shake = Math.max(GS.shake, 10);
  S.hitArmor();
  // 掉落的 P 会飞散, 可回收
  for (let i = 0; i < 2; i++) dropItem(p.x + rand(-20, 20), p.y - 10, ITEM.P, { vx: rand(-1.4, 1.4), vy: rand(-3.4, -2.0) });
  addText(p.x, p.y - 34, 'POWER DOWN', '#ff8080', 13, 50);
  explosion(p.x, p.y, 1.2);
}
function killPlayer(){
  const p = player;
  if (p.dead) return;
  p.dead = true; p.deadT = 0;
  GS.lives--;
  GS.stats.deaths++;
  explosion(p.x, p.y, 5.5); GS.shake = 22; GS.flash = 10; GS.flashCol = '#ff6060';
  S.die();
  p.gauge = 0; p.holdT = 0; p.chargeFx = null; p.holding = false;
  // 掉两级威力, 散落 P 供回收
  const drop = Math.min(GS.power, 2);
  for (let i = 0; i < drop; i++) dropItem(p.x + rand(-26, 26), p.y - 16, ITEM.P, { vx: rand(-1.6, 1.6), vy: rand(-3.6, -2.2) });
  GS.power = Math.max(0, GS.power - 2);
  ebullets = ebullets.filter(function(b){ return Math.random() < 0.35; });
}
function respawn(){
  const p = player;
  p.dead = false; p.x = W / 2; p.y = H - 96; p.invul = 170;
  p.fireT = 0; p.gauge = 0; p.holdT = 0; p.chargeFx = null;
  GS.bombs = Math.max(GS.bombs, 2);
  addText(p.x, p.y - 50, 'READY', '#7dffb0', 18, 60);
}
// ============================================================
//  Part 06: BOSS —— 多部件 / 变形 / 多阶段弹幕
// ============================================================

const BOSS_HP_UNIT = 1100;

function spawnBoss(key, nameOverride){
  const def = BOSSES[key];
  if (!def) return null;
  const base = BOSS_HP_UNIT * def.hp * bossHpScale();
  const b = {
    key: key, def: def,
    x: W / 2, y: -200, targetY: 148,
    enter: true, t: 0, sway: rand(0, TAU),
    swayAmp: def.swayAmp || 84, swaySpd: def.swaySpd || 0.0068,
    phase: 1, parts: [], core: null,
    dying: 0, morph: 0, morphing: 0, morphing2: false, retreat: 0,
    timeLeft: def.time, atkT: 0, hitFlash: 0,
    dead: false, finished: false, invul: 0
  };
  for (const pd of def.parts){
    const part = {
      key: pd.key, ox: pd.ox, oy: pd.oy, kind: pd.kind,
      hp: base * pd.hp, maxHp: base * pd.hp, r: pd.r, w: pd.w, h: pd.h,
      x: b.x + pd.ox, y: b.y + pd.oy, dead: false, hitFlash: 0, shieldFx: 0, t: 0, fireT: irand(0, 60),
      aim: 0, charge: 0, isCore: pd.kind === 'core'
    };
    b.parts.push(part);
    if (part.isCore) b.core = part;
  }
  b.name = nameOverride || def.name;
  boss = b;
  return b;
}
function bossAliveParts(){
  if (!boss) return [];
  return boss.parts.filter(function(p){ return !p.dead && !p.isCore; });
}
function bossPartByKey(k){ if (!boss) return null; for (const p of boss.parts) if (p.key === k) return p; return null; }

function updateBoss(){
  const b = boss;
  if (!b) return;
  b.t++;
  if (b.hitFlash > 0) b.hitFlash--;

  // 入场
  if (b.enter){
    b.y += 2.2;
    if (b.y >= b.targetY){ b.y = b.targetY; b.enter = false; }
    syncParts(b);
    return;
  }
  // 死亡演出
  if (b.dying > 0){
    b.dying--;
    if (b.dying % 5 === 0){
      explosion(b.x + rand(-110, 110), b.y + rand(-60, 60), rand(1.4, 3.4));
      if (b.dying % 15 === 0) S.boom();
    }
    GS.shake = Math.max(GS.shake, 4);
    syncParts(b);
    if (b.dying === 1) finishBoss();
    return;
  }
  // 变形演出
  if (b.morphing > 0){
    b.morphing--;
    b.morph = 1 - b.morphing / 60;
    if (b.morphing % 8 === 0){ explosion(b.x + rand(-70, 70), b.y + rand(-40, 40), 1.6); S.boom(); }
    GS.shake = Math.max(GS.shake, 6);
    syncParts(b);
    if (b.morphing === 0){
      b.phase = 2;
      GS.flash = 12; GS.flashCol = '#fff';
      S.bossWarn();
    }
    return;
  }
  if (b.invul > 0) b.invul--;

  // 移动
  b.sway += b.swaySpd;
  const amp = b.phase >= 2 ? b.swayAmp * 1.1 : b.swayAmp;
  b.x = W / 2 + Math.sin(b.sway) * amp;
  b.y = b.targetY + Math.sin(b.sway * 1.9) * 20 + (b.phase >= 2 ? Math.sin(b.t * 0.013) * 14 : 0);
  syncParts(b);

  // 阶段推进
  const partsLeft = bossAliveParts().length;
  if (b.phase === 1 && partsLeft === 0){
    if (b.def.morph){ b.morphing = 60; b.phase = 1.5; GS.flash = 14; GS.flashCol = '#ffd0d0'; S.bigBoom(); }
    else {
      b.phase = 2; b.invul = 40;
      GS.flash = 12; GS.flashCol = '#ffd0d0';
      S.bossWarn();
      for (let i = 0; i < 6; i++) explosion(b.x + rand(-90, 90), b.y + rand(-50, 50), 2);
    }
  }
  // 计时: 时间耗尽 -> 撤退(彩京式)
  if (b.timeLeft > 0){
    b.timeLeft--;
    if (b.timeLeft === 0 && b.dying === 0 && !b.finished){
      b.retreat = 90;
      GS.flash = 10; GS.flashCol = '#88aaff';
      S.bossWarn();
      addText(b.x, b.y - 70, 'TIME UP — 敌机撤退', '#88aaff', 18, 110);
      for (const eb2 of ebullets) dropItem(eb2.x, eb2.y, ITEM.GOLD, { vx: rand(-1, 1), vy: rand(-1, 1) });
      ebullets = [];
    }
  }
  // 撤退演出
  if (b.retreat > 0){
    b.retreat--;
    b.y -= 2.4;
    b.x += Math.sin(b.retreat * 0.1) * 1.2;
    if (b.retreat % 10 === 0) explosion(b.x + rand(-60, 60), b.y + rand(-40, 40), 1.4);
    if (b.retreat === 0){
      GS.bossTimeBonus = 0;
      boss = null;
      GS.state = 'clearwait';
      GS.clearTimer = 150;
      addText(W / 2, H / 2, 'STAGE CLEAR (TIME UP)', '#88aaff', 22, 120);
      S.stageClear();
      return;
    }
    syncParts(b);
    return;
  }

  b.atkAcc = (b.atkAcc || 0) + 1 / rateMul();
  while (b.atkAcc >= 1){ b.atkAcc -= 1; b.atkT++; }
  bossAI(b);
  // 核心被击破
  if (b.core && b.core.hp <= 0 && b.dying === 0 && !b.finished){
    b.dying = 130;
    GS.stats.kills++;
    addScore(b.def.parts ? (b.core.maxHp | 0) * 0 + 30000 + GS.stageNum * 4000 : 20000);
    S.bigBoom();
    GS.shake = 30; GS.flash = 20; GS.flashCol = '#fff';
  }
  // 部件粒子
  for (const p of b.parts){
    if (p.dead && p.kind !== 'core' && Math.random() < 0.08) smoke(p.x + rand(-10, 10), p.y + rand(-8, 8));
  }
}
function syncParts(b){
  for (const p of b.parts){
    if (p.shieldFx > 0) p.shieldFx--;
    if (p.dead) continue;
    p.t++;
    p.x = b.x + p.ox;
    p.y = b.y + p.oy;
  }
}
function bossCoreShielded(){
  return !!(boss && boss.parts.some(function(p){ return !p.dead && !p.isCore; }));
}
function bossPartDamage(part, dmg){
  if (!boss || part.dead) return;
  if (boss.invul > 0 || boss.morphing > 0 || boss.dying > 0) return;
  // 核心在部件未全破前被装甲覆盖, 完全免伤(彩京式部件战)
  if (part.isCore && bossCoreShielded()){ part.shieldFx = 4; return; }
  part.hp -= dmg;
  part.hitFlash = 2;
  if (part.hp <= 0 && !part.isCore){
    part.dead = true;
    explosion(part.x, part.y, 3.4);
    S.bigBoom(); GS.shake = Math.max(GS.shake, 16);
    addScore(4000 + GS.stageNum * 500);
    for (let i = 0; i < 2; i++) dropItem(part.x + rand(-24, 24), part.y + rand(-14, 14), ITEM.GOLD);
    if (Math.random() < 0.6) dropItem(part.x, part.y, ITEM.P);
    for (const b2 of ebullets) if (Math.random() < 0.5) { b2.dead = true; dropItem(b2.x, b2.y, ITEM.GOLD, { vx: rand(-1, 1), vy: rand(-1, 1) }); }
    ebullets = ebullets.filter(function(x){ return !x.dead; });
  }
}
function finishBoss(){
  const b = boss;
  if (!b || b.finished) return;
  b.finished = true;
  explosion(b.x, b.y, 9); GS.shake = 30; GS.flash = 22; GS.flashCol = '#fff';
  S.bigBoom();
  for (let i = 0; i < 12; i++) dropItem(b.x + rand(-100, 100), b.y + rand(-50, 50), i % 4 === 0 ? ITEM.P : ITEM.GOLD);
  dropItem(b.x, b.y + 20, ITEM.B);
  for (const eb2 of ebullets) dropItem(eb2.x, eb2.y, ITEM.GOLD, { vx: rand(-1.2, 1.2), vy: rand(-1.2, 0.4) });
  ebullets = [];
  // 时间评价: 记录本关通关耗时
  GS.stats.stageTimes.push(GS.stageTime / 60);
  const timeBonus = Math.round(Math.max(0, b.timeLeft) / 60) * 800;
  GS.bossTimeBonus = timeBonus;
  addScore(30000 + GS.stageNum * 5000 + timeBonus);
  boss = null;
  GS.state = 'clearwait';
  GS.clearTimer = 190;
  S.stageClear();
}
function bossTimeBonusText(){
  const s = Math.round((GS.bossTimeBonus || 0));
  return 'TIME BONUS  ' + s;
}

// ---------- BOSS 弹幕 ----------
function bp(b, key, x, y, ang, spd, col, r){
  const p = bossPartByKey(key);
  return eb(x, y, ang, spd, col, r);
}
function bossAI(b){
  const key = b.key;
  const ph = b.phase >= 2 ? 2 : 1;
  const d = stageDifficulty();
  const alive = player && !player.dead;
  const f = fireScale();
  const at = b.atkT;
  if (!alive && !b.def.keepFiring) { /* BOSS 依旧开火, 保持演出 */ }

  switch (key){
    case 'tankFort': {
      const gL = bossPartByKey('gunL'), gR = bossPartByKey('gunR');
      if (gL && !gL.dead && at % Math.max(56, 96 - d * 4) === 30) fireAimed(gL.x, gL.y + 18, 3.8, 3, 0.6, '#ff6a8a');
      if (gR && !gR.dead && at % Math.max(56, 96 - d * 4) === 58) fireAimed(gR.x, gR.y + 18, 3.8, 3, 0.6, '#ff6a8a');
      if (ph === 2){
        if (at % 40 === 0) fireAimed(b.x, b.y + 30, 4.2, 7, 1.1, '#ff4a6a');
        if (at % 8 === 0){ const a = at * 0.19; for (let i = 0; i < 4; i++) eb(b.x, b.y + 20, a + i * TAU / 4, 2.9, '#ffa04a', 4.5); }
        if (at % 180 === 90) fireRing(b.x, b.y, 22 + Math.min(10, d * 2), 2.5, rand(0, TAU), '#ff4a6a');
      } else if (at % 130 === 60) fireRing(b.x, b.y, 10 + Math.min(6, d), 2.2, at * 0.03, '#ffb03a');
      break;
    }
    case 'battleship': {
      const tL = bossPartByKey('turretL'), tR = bossPartByKey('turretR'), br = bossPartByKey('bridge');
      if (tL && !tL.dead && at % Math.max(80, 130 - d * 5) === 40){
        for (let i = 0; i < 3; i++) eb(tL.x, tL.y, HPI + rand(-0.4, 0.4), 3.4, '#ffb03a', 6);
      }
      if (tR && !tR.dead && at % Math.max(80, 130 - d * 5) === 90){
        for (let i = 0; i < 3; i++) eb(tR.x, tR.y, HPI + rand(-0.4, 0.4), 3.4, '#ffb03a', 6);
      }
      if (br && !br.dead && at % Math.max(70, 110 - d * 4) === 20) fireAimed(br.x, br.y + 18, 3.6, 5, 0.9, '#ff6a8a');
      if (ph === 2){
        if (b.morph > 0.5){
          // 变形为巨型机器人
          if (at % 34 === 0) fireAimed(b.x, b.y + 40, 4.6, 3, 0.5, '#ff2255', 6);
          if (at % 7 === 0){ const a = at * 0.24; for (let i = 0; i < 3; i++) eb(b.x, b.y + 26, a + i * TAU / 3, 3.2, '#ff8030', 4.5); }
          if (at % 140 === 70) fireRing(b.x, b.y, 26, 2.7, rand(0, TAU), '#ff4a6a');
        } else {
          if (at % 46 === 0) fireAimed(b.x, b.y + 30, 4.0, 9, 1.4, '#ff4a6a');
          if (at % 150 === 60) fireRing(b.x, b.y, 20, 2.4, at * 0.02, '#c080ff');
        }
      } else if (at % 150 === 100) fireRing(b.x, b.y, 12, 2.1, at * 0.03, '#ffb03a');
      break;
    }
    case 'railgun': {
      const barrel = bossPartByKey('barrel');
      if (barrel && !barrel.dead){
        if (at % 180 === 40){ barrel.charge = 60; }
        if (barrel.charge > 0){
          barrel.charge--;
          if (barrel.charge % 4 === 0) smallExplosion(barrel.x + rand(-16, 16), barrel.y - 30, '#ffd0a0');
          if (barrel.charge === 0){
            for (let i = 0; i < 5; i++) eb(barrel.x - 30 + i * 15, barrel.y - 40, HPI, 6.4, '#ffe08a', 7);
            GS.shake = Math.max(GS.shake, 8);
          }
        }
      }
      if (at % Math.max(60, 100 - d * 4) === 20) fireAimed(b.x - 70, b.y + 24, 3.6, 3, 0.6, '#ff6a8a');
      if (at % Math.max(60, 100 - d * 4) === 60) fireAimed(b.x + 70, b.y + 24, 3.6, 3, 0.6, '#ff6a8a');
      if (ph === 2){
        if (at % 30 === 0) fireAimed(b.x, b.y + 30, 4.4, 5, 1.0, '#ff2255', 5);
        if (at % 6 === 0){ const a = at * 0.13; eb(b.x, b.y, a, 3.0, '#c080ff', 5); eb(b.x, b.y, a + PI, 3.0, '#c080ff', 5); }
        if (at % 160 === 80) fireRing(b.x, b.y, 24, 2.6, rand(0, TAU), '#ff4a6a');
      } else if (at % 140 === 70) fireRing(b.x, b.y, 12, 2.3, at * 0.04, '#ffb03a');
      break;
    }
    case 'bomberFort': {
      const wL = bossPartByKey('wingL'), wR = bossPartByKey('wingR'), nose = bossPartByKey('nose');
      if (wL && !wL.dead && at % Math.max(60, 100 - d * 4) === 30) fireAimed(wL.x, wL.y + 20, 3.4, 4, 0.9, '#ff6a8a');
      if (wR && !wR.dead && at % Math.max(60, 100 - d * 4) === 60) fireAimed(wR.x, wR.y + 20, 3.4, 4, 0.9, '#ff6a8a');
      if (nose && !nose.dead && at % 90 === 20){
        for (let i = 0; i < 3; i++) eb(nose.x - 12 + i * 12, nose.y + 20, HPI, 4.4, '#ffe08a', 5);
      }
      if (ph === 2){
        if (at % 5 === 0){
          const tx = rand(30, W - 30);
          eb(tx, -10, HPI, 3.2, '#ffb03a', 5);
        }
        if (at % 44 === 0) fireAimed(b.x, b.y + 30, 4.2, 7, 1.2, '#ff4a6a');
        if (at % 170 === 85) fireRing(b.x, b.y, 26, 2.5, rand(0, TAU), '#ff4a6a');
      } else if (at % 130 === 65) fireRing(b.x, b.y, 14, 2.2, at * 0.05, '#c080ff');
      break;
    }
    case 'mechaProto': {
      const aL = bossPartByKey('armL'), aR = bossPartByKey('armR');
      if (aL && !aL.dead && at % Math.max(50, 84 - d * 4) === 20) fireAimed(aL.x, aL.y + 22, 3.8, 4, 0.8, '#ff6a8a');
      if (aR && !aR.dead && at % Math.max(50, 84 - d * 4) === 45) fireAimed(aR.x, aR.y + 22, 3.8, 4, 0.8, '#ff6a8a');
      if (ph === 2){
        // 变形后: 旋钻 + 追踪
        if (at % 8 === 0){ const a = at * 0.27; for (let i = 0; i < 5; i++) eb(b.x, b.y, a + i * TAU / 5, 3.1, '#ff8030', 4.5); }
        if (at % 60 === 30) fireAimed(b.x, b.y + 36, 4.8, 3, 0.4, '#ff2255', 6);
        if (at % 150 === 75) fireRing(b.x, b.y, 28, 2.6, rand(0, TAU), '#c080ff');
      } else if (at % 120 === 60) fireRing(b.x, b.y, 12, 2.2, at * 0.04, '#ffb03a');
      break;
    }
    case 'orbital': {
      const rL = bossPartByKey('ringL'), rR = bossPartByKey('ringR');
      if (rL && !rL.dead && at % 90 === 20) fireRing(rL.x, rL.y, 8 + Math.min(6, d), 2.6, at * 0.06, '#ffb03a');
      if (rR && !rR.dead && at % 90 === 65) fireRing(rR.x, rR.y, 8 + Math.min(6, d), 2.6, -at * 0.06, '#ffb03a');
      if (at % Math.max(60, 100 - d * 4) === 40) fireAimed(b.x, b.y + 30, 3.8, 5, 1.0, '#ff6a8a');
      if (ph === 2){
        if (at % 6 === 0){ const a = at * 0.21; for (let i = 0; i < 6; i++) eb(b.x, b.y, a + i * TAU / 6, 3.0, '#c080ff', 4.5); }
        if (at % 40 === 0) fireAimed(b.x, b.y + 34, 4.6, 5, 1.0, '#ff2255');
        if (at % 150 === 75) fireRing(b.x, b.y, 30, 2.6, rand(0, TAU), '#ff4a6a');
      }
      break;
    }
    case 'crabAlien': {
      const cL = bossPartByKey('clawL'), cR = bossPartByKey('clawR');
      const eL = bossPartByKey('eyeL'), eR = bossPartByKey('eyeR');
      if (cL && !cL.dead && at % Math.max(50, 90 - d * 4) === 30) fireAimed(cL.x, cL.y + 16, 3.6, 6, 1.3, '#7dffb0');
      if (cR && !cR.dead && at % Math.max(50, 90 - d * 4) === 70) fireAimed(cR.x, cR.y + 16, 3.6, 6, 1.3, '#7dffb0');
      if (eL && !eL.dead && at % 44 === 10) fireAimed(eL.x, eL.y + 10, 4.4, 2, 0.25, '#ff6a8a', 4);
      if (eR && !eR.dead && at % 44 === 32) fireAimed(eR.x, eR.y + 10, 4.4, 2, 0.25, '#ff6a8a', 4);
      if (ph === 2){
        if (at % 5 === 0){ const a = at * 0.17; for (let i = 0; i < 7; i++) eb(b.x, b.y + 10, a + i * TAU / 7, 3.0, '#7dffb0', 4.5); }
        if (at % 46 === 0) fireAimed(b.x, b.y + 30, 4.4, 6, 1.2, '#ff2255', 5);
        if (at % 160 === 80) fireRing(b.x, b.y, 32, 2.6, rand(0, TAU), '#ff4a6a');
      }
      break;
    }
    case 'mechaCany': {
      const aL = bossPartByKey('armL'), aR = bossPartByKey('armR');
      const sL = bossPartByKey('shoulderL'), sR = bossPartByKey('shoulderR');
      if (aL && !aL.dead && at % 80 === 20) fireAimed(aL.x, aL.y + 30, 4.0, 5, 0.9, '#ff6a8a');
      if (aR && !aR.dead && at % 80 === 60) fireAimed(aR.x, aR.y + 30, 4.0, 5, 0.9, '#ff6a8a');
      if (sL && !sL.dead && at % 64 === 16) fireRing(sL.x, sL.y, 7, 2.6, at * 0.09, '#c080ff', 4.5);
      if (sR && !sR.dead && at % 64 === 48) fireRing(sR.x, sR.y, 7, 2.6, -at * 0.09, '#c080ff', 4.5);
      if (at % 34 === 0) fireAimed(b.x, b.y + 40, 4.6, 3, 0.6, '#ff2255', 5.5);
      if (ph === 2){
        const sub = b.core.hp / b.core.maxHp < 0.45 ? 3 : 2;
        if (at % 6 === 0){ const a = at * 0.23; for (let i = 0; i < 8; i++) eb(b.x, b.y, a + i * TAU / 8, 3.2, '#ff8030', 4.5); }
        if (sub === 3){
          if (at % 5 === 0){ const a = -at * 0.15; for (let i = 0; i < 5; i++) eb(b.x, b.y + 20, a + i * TAU / 5, 3.6, '#7dffb0', 4.5); }
          if (at % 40 === 0) fireAimed(b.x, b.y + 44, 5.2, 7, 1.3, '#ff2255', 5);
          if (at % 120 === 60) fireRing(b.x, b.y, 34, 2.7, rand(0, TAU), '#ff4a6a');
        }
      } else if (at % 110 === 55) fireRing(b.x, b.y, 16, 2.3, at * 0.05, '#ffb03a');
      break;
    }
  }
}
