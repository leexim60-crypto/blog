<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1e3a"/>
      <stop offset="0.6" stop-color="#131a4a"/>
      <stop offset="1" stop-color="#2a1a5e"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a5c4ff"/>
      <stop offset="1" stop-color="#d8b4fe"/>
    </linearGradient>
  </defs>

  <!-- 圆角底板 -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="rgba(140,170,255,0.35)" stroke-width="1.5"/>

  <!-- 弯月 -->
  <g transform="translate(8,8) scale(2)">
    <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" fill="url(#moon)"/>
  </g>

  <!-- 主星（四角闪亮） -->
  <path d="M47 17l2 4.9 4.9 2-4.9 2L47 30.8l-2-4.9-4.9-2 4.9-2z" fill="#fff"/>
  <circle cx="47" cy="23.9" r="8.5" fill="#fff" opacity="0.18"/>

  <!-- 小星点 -->
  <circle cx="17" cy="14" r="1.8" fill="#fff" opacity="0.8"/>
  <circle cx="12" cy="26" r="1.2" fill="#a5c4ff" opacity="0.7"/>
  <circle cx="54" cy="44" r="1.5" fill="#d8b4fe" opacity="0.8"/>
  <circle cx="46" cy="52" r="1" fill="#fff" opacity="0.6"/>
</svg>
